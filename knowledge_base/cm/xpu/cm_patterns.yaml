# CM ("C for Metal") optimization patterns for Intel Xe GPUs.
#
# Loaded only when KNOWLEDGE_BASE_ENABLED=true (and DSL=cm). The loader reads
# the top-level `patterns:` and `constraints:` lists; each pattern needs a
# valid `stage` (analysis, algorithmic, dtype_fix, fusion, memory_access,
# device_specific, autotuning, discovery).

patterns:
  - id: cm_dpas_matmul
    name: "Use the DPAS (XMX) systolic array for the matmul inner product"
    stage: device_specific
    before: |
      // Scalar/vector MAC loop over K — leaves the DPAS/XMX array idle.
      for (int k = 0; k < K; ++k)
        acc += a_row[k] * b_col[k];
    after: |
      // cm_dpas CONTRACT (CM spec 4.20) — get this exact or it won't compile / is wrong:
      //   cm_dpas<Src1Prec, Src2Prec, SystolicDepth=8, RepeatCount>(Acc, Src1=B, Src2=A)
      //   ORDER is (Acc, B, A): B (Src1) comes BEFORE A (Src2).
      //   SystolicDepth is ALWAYS 8. RepeatCount = 1..8 = M rows of A per atom.
      //   ExecSize = N = DPAS output columns = 16 for a float result.
      //   fp16/bf16: OpsPerChannel=2 -> K per atom = 8*2 = 16, accumulate in FLOAT.
      //   int8     : OpsPerChannel=4 -> K per atom = 8*4 = 32, accumulate in INT (int32).
      //   Acc/result : a FLAT vector (NOT a matrix<>), RepeatCount*ExecSize elems, dtype by inputs:
      //                fp inputs  (half/bf16/tf32/bf8/hf8) -> vector<float, ...>
      //                int inputs (int2/int4/int8)         -> vector<int,   ...>   (int32)
      //   Src2 = A   : row-major,   reinterpreted to int/uint -> vector<uint, RepeatCount*8>.
      //   Src1 = B   : VNNI-PACKED, reinterpreted to int/uint -> vector<uint, 128> (ExecSize=16).
      //                (uint COUNTS above are identical for fp16 AND int8 — same §4.20 size
      //                 formula: SD*bits*ops = 8*16*2 = 8*8*4 = 256, /32 = 8.)
      //                A plain row-major B.format<uint>() is WRONG — B must be VNNI layout.
      //
      // Get the VNNI-packed B one of two ways:
      // (1) PREFERRED (needs a STATELESS svmptr_t kernel): the untyped 2D block
      //     load with VNNI Transform packs B in HARDWARE from natural [K,N] --
      //     see cm_2d_block_load_vnni / cm_stateless_vs_stateful_access. Use the
      //     function form: cm_ptr_load<half, DPAS_N, DPAS_K, 1, false, /*VNNI*/true>(
      //         pB, N*2-1, K-1, N*2-1, x, y).format<uint>();
      // (2) MANUAL: interleave consecutive K-row PAIRS into dwords (2 K-elts per dword):
      //       matrix<half, K/2, ExecSize*2> bv;
      //       for (int kp=0; kp<K/2; kp++) {                       // #pragma unroll
      //         bv.row(kp).select<ExecSize,2>(0) = b.row(2*kp+0);  // even K -> dword low
      //         bv.row(kp).select<ExecSize,2>(1) = b.row(2*kp+1);  // odd  K -> dword high
      //       }
      //       vector<uint,(K/2)*ExecSize> bpk = bv.format<uint>();
      //
      // One fp16 -> float atom (a: matrix<half, RepeatCount, 16> row-major, B VNNI-packed):
      vector<float, RepeatCount*16> acc = 0.0f;
      vector<uint, RepeatCount*8> apk = a.format<uint>();
      acc = cm_dpas<CM_PRECISION_HF, CM_PRECISION_HF, 8, RepeatCount>(acc, bpk, apk);
      // Same shape for int8 -> int32 (K per atom = 32, INT accumulator, uint-packed operands):
      //   vector<int, RepeatCount*16> iacc = 0;
      //   iacc = cm_dpas<CM_PRECISION_S8, CM_PRECISION_U8, 8, RepeatCount>(iacc, bpk, apk);
      // NOTE: a SINGLE narrow atom usually LOSES to FMA — go wide (cm_register_blocking).
    description: |
      The Xe DPAS/XMX (Dot Product Accumulate Systolic) array delivers the bulk
      of matmul throughput; express the K-loop inner product as cm_dpas. Two
      things make DPAS code fail to compile or run slow (CM spec 4.20):
        1. OPERANDS ARE FLAT uint/int VECTORS (not matrices), order (Acc, B, A):
           Src1=B is VNNI-packed, Src2=A is row-major, both reinterpreted to
           uint/int; Acc/result is a flat vector<float|int, M*N> (M=RepeatCount,
           N=16) — FLOAT for fp inputs, INT (int32) for int8/int4/int2. A plain
           row-major B.format<uint>() is WRONG — Src1 must be VNNI layout
           (use the lsc::VNNI 2D load, or interleave K-row pairs into dwords).
        2. A SINGLE narrow atom (one accumulator) does NOT beat the FMA path —
           the VNNI pack + narrow loads dominate. To win, go WIDE: an MBxNB grid
           of RepeatCount=8 accumulators fed by block loads (cm_register_blocking).
           Load each operand ROW with ONE wide block load spanning the FULL tile
           width and .select<>() the per-N-block operand out of it — do NOT issue
           a separate narrow load per N-block: that under-uses each LSC message
           and multiplies the message count for the same bytes (see
           cm_wide_block_access / cm_1d_block_load).
      DPAS supports bf16/half (-> float acc) and int8 S8/U8 (-> int32 acc), plus
      tf32/bf8/hf8/int2/int4 on capable hardware (each guarded by a CM_HAS_DPAS*
      macro). SystolicDepth is fixed at 8; RepeatCount (1..8) = A rows per atom.
    rationale: "DPAS far out-throughputs scalar/vector FMA, but only when B is correctly VNNI-packed (spec 4.20) and the tile is wide enough to amortize the pack and keep the systolic array fed."
    expected_speedup: "3-10x for GEMM once B is VNNI-packed and the tile is wide"
    applies_to: [gemm, matmul, conv, dpas, int8, quantized]
    requires: [xmx]  # needs the XMX/DPAS systolic array (absent on Xe-LPG / MTL / ARL)

  - id: cm_operand_prepack
    name: "Pre-pack the static DPAS weight (Src1/B) into VNNI layout offline, not in the hot loop"
    stage: memory_access
    before: |
      // The kernel re-shuffles B into the DPAS Src1 (VNNI) byte layout every
      // k-step — a per-iteration interleave that dominates the inner loop of an
      // otherwise DPAS-bound GEMM.
      for (int kp = 0; kp < DPAS_K/2; ++kp) {
        bv.row(kp).select<16,2>(0) = b.row(2*kp+0);   // manual VNNI pack, hot loop
        bv.row(kp).select<16,2>(1) = b.row(2*kp+1);
      }
    after: |
      // Pre-pack the STATIC operand (weights = B = DPAS Src1) ONCE on the host
      // into the exact Src1 VNNI byte layout, then the kernel just loads each
      // atom as one contiguous block — the in-loop shuffle is gone entirely:
      vector<uint,128> bpk = cm_load<uint,128>(surfB_packed, atom_byte_off);
      acc = cm_dpas<CM_PRECISION_HF, CM_PRECISION_HF, 8, RPT>(acc, bpk, apk);
    description: |
      The manual per-k-step shuffle that
      builds the DPAS Src1 operand is the dominant cost of a hand-packed DPAS
      GEMM, so move it OFF the device — transform the static weight tensor into
      the exact Src1 VNNI byte layout once on the host, store it that way, and
      have the kernel issue one contiguous cm_load per atom (bytes identical to
      what the shuffle produced, so the result is bit-for-bit the same).
      THREE findings:
        - Only Src1 (B, the VNNI operand) benefits. Pre-blocking Src2 (A, which
          DPAS consumes row-major) gave NO win — A already streams as contiguous
          rows, so spend the effort only on the VNNI operand.
        - Offline pre-pack beats the in-kernel hardware VNNI 2D-transform load
          ONLY while the kernel is still operand-feed bound (e.g. NOT yet L2
          cache-blocked). Once an L2 tile swizzle (cm_l2_tile_swizzle) makes the
          operands cache-resident, the bottleneck shifts to load-MESSAGE count and
          the HW-VNNI 2D load WINS: it fetches a DPAS-ready B atom in ONE message
          (and up to 2 N-atoms per message with a Width-32 VNNI load -- see
          cm_2d_block_load_vnni), whereas the offline-packed atom (128 uints)
          needs TWO 1D loads (the 1D block max is 64 elements). Measured: offline
          pre-pack helped (~+20%) on an un-swizzled kernel but slightly HURT
          (~-5%) once swizzled (and the wide HW-VNNI load widens that gap
          further). So offline packing and L2 swizzling are SUBSTITUTES for the
          same feed bottleneck -- prefer the swizzle (no host preprocessing, and
          it keeps the cheaper, fewer-message 2D load).
        - Pack ONCE and reuse across every GEMM that shares the weight — the cost
          amortizes to ~zero over inference.
      APPLICABILITY: this needs a host-side preprocessing step / a layout-
      transformed weight input (a "pre-packed weights" variant of the op). It fits
      STATIC weights (Linear / conv / FFN / quantized int8), NOT operands produced
      on-device earlier in the same graph. When you CANNOT pre-pack (both operands
      are dynamic, or the harness forbids transforming inputs), the in-kernel
      equivalent is the hardware VNNI 2D block load (cm_load<lsc::VNNI>, see
      cm_dpas_matmul) which at least moves the pack into the load hardware -- or,
      better still, re-orient the matmul so the operand that needs packing is the
      small/dynamic one and the static weight stays row-major (see
      cm_dpas_operand_role_choice).
    rationale: "Building the DPAS Src1 VNNI operand dominates a hand-packed GEMM's inner loop; pre-packing the static weight off-device turns it into a single contiguous load, and only the VNNI operand (not the row-major one) needs it."
    expected_speedup: "up to ~2x for a GEMM whose inner loop is dominated by the in-kernel VNNI pack (requires offline weight packing)"
    applies_to: [gemm, matmul, conv, dpas, int8, quantized, ffn]
    requires: [xmx]

  - id: cm_dpas_operand_role_choice
    name: "Pick DPAS operand roles so the costly operand isn't VNNI-packed"
    stage: device_specific
    before: |
      // A reused/static operand (or one stored transposed vs [K,N]) is being
      // VNNI-packed for Src1 on every tile -- the pack dominates the DPAS loop,
      // and the obvious mapping can end up SLOWER than the vector-FMA path.
      // (e.g. a Linear weight stored [out,in]=[N,K], repacked to [K,N] every tile)
    after: |
      // DPAS computes  Acc[M,N] = A[M,K] (Src2, row-major) * B[K,N] (Src1, VNNI).
      // The pack is the dominant cost -- so DECIDE which operand pays it. The
      // transpose identity  C^T = B^T * A^T  lets EITHER physical tensor take the
      // row-major Src2 (A) slot: compute the TRANSPOSED result and swap roles.
      // Put the operand that is EXPENSIVE to pack (large / static / reused across
      // tiles / awkwardly laid out) in the row-major Src2 (A) role -- it is then
      // consumed in its NATIVE layout, never packed -- and VNNI-pack only the
      // SMALL / dynamic / in-register operand as Src1 (B). Transpose the small
      // result tile back in registers; that is far cheaper than repacking A.
      //
      // Worked example -- a Linear  out[t,o] = sum_k act[t,k]*W[o,k], W=[out,in]:
      //   naive : A=act, B=W^T   -> must transpose+VNNI the big static weight.
      //   better: compute  out^T[o,t] = W[o,k] * act^T[k,t]
      //           A = W      (row-major [out,K]; loaded directly, NO transpose/pack)
      //           B = act^T  (the small activation, VNNI-packed)
      //           then transpose the [out,tok] result tile back to [tok,out].
    description: |
      Before reaching for an offline pre-pack (cm_operand_prepack) or a hardware
      VNNI 2D load (cm_dpas_matmul), ask WHICH operand you are forced to pack --
      the VNNI pack is what dominates DPAS feed, so assign the operand roles to
      AVOID packing the expensive one. Because Acc = A*B and C^T = B^T*A^T, either
      physical tensor can play the row-major Src2 (A); you pay only one small
      in-register transpose of the result tile.
      WHEN THIS FIRES (symptoms -- so it is recognizable on any kernel, not a
      specific op):
        - you are about to VNNI-pack an operand INSIDE the hot loop, or
        - one operand is a STATIC tensor reused across many tiles while the other
          is small / dynamic / produced in-register, or
        - the operand you'd pack is stored TRANSPOSED relative to the [K,N] a VNNI
          load wants (e.g. a Linear/conv weight stored [out,in]).
      DECISION: orient the matmul so that operand becomes the row-major Src2 (A)
      and the cheap/dynamic operand becomes the VNNI Src1 (B); transpose the small
      result back.
      This is the THIRD option the sibling patterns leave open: cm_operand_prepack
      pre-packs the static weight OFFLINE, cm_dpas_matmul packs it via the HW VNNI
      LOAD -- but when you CANNOT pre-pack (dynamic operands / the harness forbids
      transforming inputs) AND the layout does not suit a VNNI load, re-orienting
      avoids the pack ENTIRELY. Applies to any DPAS matmul -- standalone GEMM or
      the linear projections fused inside attention / FFN / conv blocks.
    rationale: "The VNNI pack dominates DPAS feed; the identity C^T=B^T*A^T lets the expensive operand stay row-major (unpacked) while only the small/dynamic one is packed -- which can flip DPAS from slower-than-FMA to far faster."
    expected_speedup: "removes a per-tile VNNI repack from the inner loop -- multiples when the naive mapping is pack-bound"
    applies_to: [gemm, matmul, dpas, attention, ffn, conv, fused, mixed_ops]
    requires: [xmx]

  - id: cm_simd_width
    name: "Widen vectors/matrices to let the compiler emit wider SIMD"
    stage: device_specific
    before: |
      // SIMD width is per-instruction on Intel GPUs and follows the operand
      // width. Narrow per-thread vectors force narrow SIMD instructions that
      // under-utilize the EU.
      vector<float, 8> v = ...;   // tends to compile to a narrow SIMD op
    after: |
      // Operate on wider vectors/matrices so the backend can select wider
      // SIMD (e.g. SIMD16/SIMD32) instructions and amortize control overhead.
      vector<float, 32> v = ...;  // wider operand -> wider SIMD instruction
      // NOTE: there is no LANES/EXEC_SIZE #define that "sets" SIMD width.
      // Fixed-size systolic ops are the exception: cm_dpas runs at a fixed
      // execution size (e.g. 16); tune its throughput via RepeatCount / tile
      // size, not by changing SIMD width.
    description: |
      On the Intel GPU ISA the SIMD width is chosen per instruction and is
      driven by the width of the vector/matrix being operated on — wider
      operands give the compiler the chance to issue wider SIMD instructions.
      It is not selected by a macro/define. Size per-thread vectors/matrices to
      keep the EU busy without spilling the GRF.
    rationale: "Wider operands let the backend pick wider SIMD, raising lane utilization and hiding instruction latency."
    expected_speedup: "1.2-2x"
    applies_to: [elementwise, gemm, reduction]

  - id: cm_loop_unroll
    name: "Unroll tight, compile-time-bounded inner loops with #pragma unroll"
    stage: device_specific
    before: |
      // Rolled inner loop: a per-iteration branch + induction-variable update,
      // and the runtime index blocks static GRF addressing of register tiles.
      for (int k = 0; k < K; k += TILE_K)
        acc = cm_dpas<CM_PRECISION_BF, CM_PRECISION_BF, 8, M>(acc, b, a);
    after: |
      // Fully unroll small loops whose trip count is a compile-time constant.
      // This removes loop control overhead, turns the index into a constant
      // (required for static .select<>()/.row() GRF addressing), keeps the
      // accumulator register-resident, and lets the scheduler interleave loads
      // with the compute to hide latency. Unroll tight chunk loops like this:
      #pragma unroll
      for (int t = 0; t < NUM_TILES; t++)          // NUM_TILES is a compile-time constant
        tile.row(t) = cm_load<uint, TILE_ELEMS>(surf, offset[t]);

      // Use a PARTIAL factor when full unroll would be too large:
      #pragma unroll 4
      for (int k = 0; k < K; k += TILE_K) { /* ... */ }

      // And keep LARGE / runtime-bounded loops rolled to bound code size and
      // register pressure:
      #pragma nounroll
      for (int i = 0; i < num_iters; i++) { /* ... */ }
    description: |
      #pragma unroll (optionally "#pragma unroll N" for a partial factor) tells
      the compiler to unroll the next loop; #pragma nounroll forbids it. Full
      unrolling needs a compile-time-constant trip count.
      Benefits: removes branch/induction overhead; makes loop indices constant
      so register tiles can be addressed statically with .select<>()/.row()
      (often REQUIRED, not just faster); exposes more instruction-level
      parallelism so loads and compute (DPAS or plain FMA) pipeline together.
      Consequences: more unrolling means a larger instruction footprint and
      more simultaneously-live values, which raises GRF pressure and can cause
      register spills that collapse performance (see cm_register_file_budget).
      When useful: tight inner loops with small, fixed bounds — e.g. the K/TILE_K
      DPAS loop and tile-chunk loops. Prefer #pragma nounroll or a small
      partial factor for long or runtime-bounded loops.
    rationale: "Unrolling tight constant-bound loops cuts control overhead, enables static GRF indexing, and pipelines loads with compute (DPAS or FMA) — but over-unrolling spills the GRF."
    expected_speedup: "1.1-1.5x for tight inner loops (and can be required for static GRF indexing)"
    applies_to: [gemm, conv, reduction, dpas, elementwise]

  - id: cm_register_blocking
    name: "Register/output blocking — reuse each loaded operand across a per-thread tile"
    stage: memory_access
    before: |
      // Small per-thread output tile: each loaded A/B value feeds very few MACs,
      // so the kernel streams operands from memory faster than it computes on
      // them (low arithmetic intensity, memory/latency bound).
      matrix<half, 1, BLOCK_N> acc = 0;          // 1 row -> each B element used once
    after: |
      // Hold a larger BLOCK_M x BLOCK_N output tile in registers for the whole
      // K-loop. A rank-BLOCK_K update reuses each loaded A element across BLOCK_N
      // columns and each loaded B element across BLOCK_M rows, so each memory load
      // feeds ~BLOCK_M*BLOCK_N/(BLOCK_M+BLOCK_N) MACs instead of ~1.
      matrix<half, BLOCK_M, BLOCK_N> acc = 0;    // register-resident accumulator
      for (int k0 = 0; k0 < K; k0 += BLOCK_K) {
        matrix<half, BLOCK_M, BLOCK_K> a;        // load A sub-tile (1D block loads)
        matrix<half, BLOCK_K, BLOCK_N> b;        // load B sub-tile
        // ... load a, b ...
        #pragma unroll
        for (int kk = 0; kk < BLOCK_K; kk++) {
          vector<half, BLOCK_N> brow = b.row(kk);
          #pragma unroll
          for (int i = 0; i < BLOCK_M; i++)
            acc.row(i) += a(i, kk) * brow;       // each load reused across the tile
        }
      }
      // ON DPAS: the A-operand row count fed to each cm_dpas IS the RepeatCount
      // (1..8), and the VNNI-packed Src1=B tile (weights / the reused static
      // tensor) is shared across ALL those rows in ONE systolic pass. Map BLOCK_M
      // so every cm_dpas runs at RepeatCount = 8 -> each B tile is amortized over
      // the MAXIMUM rows. If the natural per-thread row count is < 8, COALESCE
      // more INDEPENDENT output rows/positions into the thread until M reaches 8.
    description: |
      The foundational GEMM/conv optimization and the FIRST lever to try on a
      memory/latency-bound matmul — independent of whether the device has DPAS.
      Each thread keeps a BLOCK_M x BLOCK_N output tile in registers and updates
      it by a rank-BLOCK_K outer product, so every value loaded from memory is
      reused across the tile instead of once. This raises arithmetic intensity
      (FLOP per byte) and keeps the ALUs — or the DPAS array, if present — fed.
      On hardware WITH DPAS the register tile is what the DPAS instruction
      operates on; WITHOUT DPAS it directly cuts the load/compute ratio that
      bounds a naive kernel. The independent accumulator rows also give the
      scheduler instruction-level parallelism to hide load + MAC latency (often
      more effective than source-level double-buffering on in-order EUs — measure
      before adding explicit prefetch).
      PREFER A FULL SYSTOLIC PASS (RepeatCount = 8) — THE MAIN LEVER ON DPAS: the
      A-operand row count fed to each cm_dpas IS the RepeatCount (1..8), and every
      VNNI-packed Src1=B tile (the weights / the reused static tensor) is shared
      across ALL of those rows in a single systolic pass. So RepeatCount = 8
      amortizes each loaded/packed B tile over the MAXIMUM number of MACs, while
      RepeatCount < 8 BOTH wastes systolic throughput AND re-streams the same B
      for too few rows. ALWAYS map the problem so the per-thread row count is a
      multiple of 8 and each cm_dpas runs at RepeatCount = 8. If the natural
      per-thread row count is below 8 (few output rows/positions), COALESCE more
      INDEPENDENT output rows or output positions into ONE thread until you reach
      8 — this is the single biggest lever for amortizing weight/tensor traffic
      and keeping the array full. Then keep GROWING the tile (more rows in
      multiples of 8, and/or wider N) so each B tile is reused across even more
      rows: the more output a thread holds, the fewer times the shared weights are
      re-fetched, and the higher the arithmetic intensity.
      MAXIMIZE OPERAND (WEIGHT/TENSOR) REUSE FIRST: identify the operand that is
      shared across the most work (in a matmul/conv this is the weights / static
      tensor) and grow the tile along the dimension that reuses it the most, so it
      is fetched as few times as possible.
      TRADE-OFF — bigger tile = more reuse but more registers, fewer resident
      threads (occupancy), and eventual GRF spills that collapse throughput.
      Because a tall, reuse-maximizing accumulator needs many live registers, a
      register-blocked DPAS tile almost ALWAYS needs the LARGE register file: set
      `-Qxcm_register_file_size=256` (or the in-source `// xe-forge-build:`
      directive) when you grow the tile, and do NOT drop back to the small GRF for
      occupancy — the reuse a full tile buys outweighs the lost resident threads
      (see cm_grf_register_file_size, cm_register_file_budget, cm_occupancy_balance).
      THE SWEET SPOT IS A CLIFF, NOT A SLOPE: reuse keeps improving as the tile
      grows (and as B is shared over more rows), but the moment the live
      accumulator + operand set exceeds the register file the kernel SPILLS and
      throughput collapses (measured roughly -80% past the cliff). So, holding
      RepeatCount at 8, SWEEP the tile UPWARD and STOP at the LARGEST tile that
      maximizes B (weight/tensor) reuse WITHOUT spilling — prefer the tallest
      non-spilling tile that keeps the array full over a smaller "balanced" one.
    rationale: "Reusing each loaded operand across a register-resident tile raises arithmetic intensity and feeds the ALUs/DPAS; on DPAS, map the per-thread rows to a FULL RepeatCount=8 systolic pass so each weight/tensor tile is amortized over the maximum MACs, then grow the tile (with the large GRF) to reuse weights across more rows until just before it spills."
    expected_speedup: "2-5x over a naive per-element kernel; an under-filled RepeatCount (<8) or no weight reuse typically leaves ~2x on the table (problem- and hardware-dependent; tune the tile to just below the spill cliff)"
    applies_to: [gemm, matmul, conv, reduction]

  - id: cm_k_loop_pipeline
    name: "Software-pipeline the K loop: prefetch the next K-block into named double buffers"
    stage: device_specific
    before: |
      // Synchronous K loop: each k-block LOADS its operands, then computes on
      // them. The DPAS array stalls waiting for the loads of the NEXT block
      // because nothing overlaps the load latency with compute.
      for (int kb = 0; kb < KBLK; ++kb) {
        load_A(kb); load_B(kb);          // LSC loads ...
        dpas_accumulate(kb);             // ... then DPAS waits on them
      }
    after: |
      // Double-buffer: keep TWO explicitly-NAMED operand register sets and issue
      // the load for k-block (kb+1) BEFORE computing on kb, so the LSC loads run
      // under the DPAS compute (latency hidden). Unroll K by 2 (even -> set0,
      // odd -> set1) and prefetch one block ahead.
      load_A0(0); load_B0(0);                          // preload block 0 into set 0
      for (int kb = 0; kb < KBLK; ++kb) {
        if (kb + 1 < KBLK) { load_A1(kb+1); load_B1(kb+1); }  // prefetch next -> other set
        dpas_accumulate(/* current set for kb */);     // compute while the next loads run
        // the unroll-by-2 names the two sets statically and swaps their roles
      }
      // CRITICAL: the two buffers must be DISTINCT NAMED variables (b0/b1), NOT a
      // runtime-indexed register array buf[cur] — an indexed register array forces
      // dynamic GRF addressing, spills the operands to stack, and ends up slower
      // than the un-pipelined kernel (see cm_loop_unroll: indices must be const).
    description: |
      Overlap the next K-block's LSC loads with the current block's DPAS compute
      by software-pipelining (double-buffering) the K loop. Hold two NAMED
      operand register sets, preload block 0, then inside the loop prefetch block
      kb+1 into the idle set before issuing the DPAS on block kb. This hides load
      latency behind compute and is the main lever once a kernel is LATENCY-bound
      (not yet saturating the DPAS array) — most effective on small/medium tiles.
      THREE measured caveats:
        - NAMED buffers, never an indexed register array. b0/b1 as separate
          variables stay in registers; buf[cur] with a runtime cur spills to
          stack and is far slower than the un-pipelined kernel.
        - DIMINISHING once compute-bound: on a large square tile that already
          saturates the DPAS array, full double-buffering adds ~0% AND its extra
          operand buffers can overflow the register file. Pipeline the smaller /
          latency-bound tile; do not stack it on the biggest tile.
        - SINGLE-SIDED when GRF is tight: if a full double-buffer overflows the
          file, prefetch ONLY the latency-dominant operand (in GEMM that is B /
          Src1 — more load messages and bytes per k-step) for most of the win at
          half the extra register cost.
      And do NOT drop to the smaller register file to regain occupancy on a
      pipelined kernel: the pipeline's instruction-level parallelism needs those
      registers, so halving GRF for more resident threads was a large net loss.
      REGISTER-FREE ALTERNATIVE (prefer when the tile is large): instead of a
      second operand register set, issue a HARDWARE PREFETCH for the next K-block
      -- cm_ptr_prefetch<T, Width, Height, NBlocks>(ptr, SurfW-1, SurfH-1,
      SurfPitch-1, X, Y) (2D) or cm_prefetch / cm_ptr_prefetch (1D) -- which warms
      L1/L2 with NO register buffer. It hides load latency WITHOUT stealing the
      accumulator budget, so it can stack on a full-tile kernel where a register
      double-buffer regressed. Prefetch one K-block ahead and measure.
    rationale: "Prefetching the next K-block into a second named register buffer overlaps LSC load latency with DPAS compute; it pays when latency-bound, saturates when compute-bound, and must use static named buffers to avoid stack spills."
    expected_speedup: "1.1-1.2x on a latency-bound tile; ~0 once compute-bound (and a net loss if it spills)"
    applies_to: [gemm, matmul, conv, dpas]

  - id: cm_l2_tile_swizzle
    name: "Remap the tile schedule into operand-sharing super-blocks for L2 reuse"
    stage: device_specific
    before: |
      // Row-major tile mapping: program id (gx,gy) -> output tile
      // (gx*BLOCK_M, gy*BLOCK_N). Tiles scheduled close in time sweep a whole
      // output row, so the A rows + B columns they touch form a LARGE working
      // set that thrashes L2 -- the DPAS array then stalls on HBM-latency loads.
      const int tm = cm_global_id(0) * BLOCK_M;
      const int tn = cm_global_id(1) * BLOCK_N;
    after: |
      // Group tiles into super-blocks so tiles processed close in time SHARE an
      // operand panel and stay hot in L2 (the classic GEMM "GROUP_SIZE_M"
      // swizzle). Linearize the program id, then remap so SWIZZLE_M consecutive
      // M-tiles for one N-tile run together -> they all reuse the SAME B columns.
      const int num_pid_m = M / BLOCK_M, num_pid_n = N / BLOCK_N;
      const int pid = cm_global_id(0) * num_pid_n + cm_global_id(1);
      const int pid_in_grp = SWIZZLE_M * num_pid_n;
      const int gid = pid / pid_in_grp;
      const int first_m = gid * SWIZZLE_M;
      int gsz = num_pid_m - first_m; if (gsz > SWIZZLE_M) gsz = SWIZZLE_M;
      const int pid_m = first_m + (pid % gsz);
      const int pid_n = (pid % pid_in_grp) / gsz;
      const int tm = pid_m * BLOCK_M, tn = pid_n * BLOCK_N;
    description: |
      A compute-bound GEMM sitting far below the DPAS peak is usually NOT
      DPAS-issue bound but OPERAND-FEED bound: the systolic array idles waiting
      for A/B loads (e.g. a kernel doing only ~30% of peak is stalling ~70% of
      the time). Raising the L2 hit rate cuts that load latency and is one of the
      highest-value levers toward peak -- and it is a PURE SCHEDULING change:
      remap which output tile each program id computes, with no new loads, no
      extra registers, and no ABI change. The default row-major tile order makes
      the tiles in flight sweep a whole output row, so their combined A+B
      footprint thrashes L2; a super-block (group) swizzle instead keeps a
      compact set of operand-sharing tiles resident in the cache.
      HOW: linearize the 2D program id to one pid, then remap it so SWIZZLE_M
      consecutive M-tiles for each N-tile are processed together (they share that
      N-tile's B columns); grouping along N instead shares the A rows. Keep the
      remap a BIJECTION -- every output tile computed exactly once -- and verify
      correctness.
      TUNE: sweep the group size SWIZZLE_M (e.g. 4 .. num_pid_m). A bigger group
      reuses the more-expensive operand more (for a VNNI-packed/transformed B
      that is the B columns), so a near-column-major schedule (large group) often
      wins on a strong-L2 part -- measure on the target. This stacks with
      register blocking, the 2D loads, and prefetch, and costs none of their
      budget.
    rationale: "A below-peak compute-bound GEMM is operand-feed bound; reordering the tile schedule into operand-sharing super-blocks raises the L2 hit rate and feeds the DPAS array faster, at zero register/ABI cost."
    expected_speedup: "1.2-1.5x on a GEMM whose DPAS array is starved by L2/HBM load latency (sweep the group size)"
    applies_to: [gemm, matmul, conv, dpas]

  - id: cm_occupancy_balance
    name: "Balance per-thread resource use against occupancy to hide latency"
    stage: device_specific
    before: |
      // One oversized per-thread tile (large registers / large GRF / large SLM)
      // -> very few resident hardware threads -> nothing to switch to while a
      // load or long-latency op is in flight -> the EUs stall (latency-bound).
    after: |
      // A GPU hides memory + instruction latency two ways: (1) OCCUPANCY — many
      // resident threads so the EU switches to a ready thread while others wait;
      // (2) per-thread instruction-level parallelism (independent accumulators,
      // unrolling). Tune the balance:
      //   - Smaller per-thread tile / default GRF (128) -> more resident threads.
      //   - Larger tile / large GRF (256) -> more per-thread reuse, fewer threads.
      // The sweet spot is hardware-dependent; sweep both regimes and MEASURE.
      // A "Spill memory used = N bytes" compiler message means the tile/GRF combo
      // spilled — shrink the tile or raise GRF; spills usually collapse perf.
    description: |
      Occupancy = how many work-items are resident per Xe-core at once; it is a
      primary latency-hiding mechanism on GPUs. Large per-thread tiles, large GRF
      mode, and heavy SLM use each REDUCE the number of resident threads. A kernel
      that is neither bandwidth- nor compute-saturated (sitting well below peak)
      is usually latency/occupancy bound: too few threads to cover load latency.
      Rebalance by shrinking the per-thread tile, using the default register file,
      or cutting SLM — then re-measure. Conversely, if occupancy is already high
      but each thread does too little work, raise the tile (see
      cm_register_blocking). There is no universal best point: small-tile / high-
      occupancy wins on some GPUs, large-tile / high-reuse on others — which is
      why the autotuner sweeps tile sizes AND GRF and lets measurement decide.
    rationale: "Most kernels far below roofline are latency-bound; raising occupancy (smaller per-thread footprint) or per-thread ILP hides that latency. The balance is hardware-specific and must be measured."
    expected_speedup: "1.3-2x when a kernel is occupancy/latency limited"
    applies_to: [gemm, conv, reduction, elementwise, stencil]

  - id: cm_slm_staging
    name: "Stage reused tiles through SLM with the LSC SLM ops"
    stage: memory_access
    before: "// Every thread in the group re-reads the same shared tile from HBM (redundant global traffic)."
    after: |
      // PRECONDITION: a real thread group (work-group size > 1). With a group
      // of one thread, SLM and cm_barrier do nothing — see the cooperative
      // grid knobs in the grid contract and the cm_cooperative_slm_tiling
      // pattern for how to FORM the group.
      cm_slm_init(SLM_BYTES);          // total per-group SLM (bytes), declared once
      uint slm = cm_slm_alloc(SLM_BYTES);

      // --- LSC SLM store: SCALAR BYTE offset, NElts a power of two <= 64 ---
      // (half data is packed two-per-uint32, so a W-wide half row is W/2 uints
      //  — store/read it as uint, reinterpret with .format<half>())
      cm_store_slm<uint, NELTS>(slm_byte_offset, chunk);   // chunk is vector<uint, NELTS>
      cm_slm_fence(CM_GLOBAL_COHERENT_FENCE);              // order the SLM writes
      cm_barrier();                                        // visible to the whole group

      // --- LSC SLM load back into registers: SAME scalar byte offset ---
      vector<uint, NELTS> staged = cm_load_slm<uint, NELTS>(slm_byte_offset);
      cm_barrier();   // WAR guard: all reads done before the tile is overwritten
    description: |
      Use Shared Local Memory to reuse a tile across a thread group and cut HBM
      traffic. Allocate once with cm_slm_init / cm_slm_alloc; move data with the
      LSC SLM ops cm_store_slm<T, NElts>(byte_offset, chunk) and
      cm_load_slm<T, NElts>(byte_offset) — both take a SCALAR BYTE offset (NOT an
      address vector) and NElts must be a power of two <= 64 (split larger tiles
      into 64-element chunks). Synchronize writes with cm_slm_fence(
      CM_GLOBAL_COHERENT_FENCE) THEN cm_barrier(); add a trailing cm_barrier
      before the SLM region is reused so no thread overwrites data others are
      still reading. The non-LSC fallback is cm_slm_write(slm, addr_elems, v) /
      cm_slm_read(slm, addr_elems, v), whose offsets are ELEMENT indices (build
      them with cmtl::cm_vector_assign from <cm/cmtl.h>).
      THIS ONLY HELPS WITH A THREAD GROUP: it is a no-op (pure overhead) unless a
      cooperative work-group-size knob is > 1 — see cm_cooperative_slm_tiling.
      AND EVEN WITH A GROUP, MEASURE: on hardware with a strong L2 cache the
      cache may already capture this reuse, so SLM staging only wins when the
      shared reuse exceeds what the cache provides — the cm_slm_fence + cm_barrier
      sync is not free and can make SLM a net loss. Verify, don't assume.
    rationale: "SLM bandwidth is higher than HBM, but a strong L2 may already serve the shared tile and the barriers add sync cost — group-level SLM staging only pays when measured reuse exceeds the cache; always verify on the target hardware."
    expected_speedup: "conditional: up to ~1.5-3x when the cache does NOT already capture the reuse and the group is real; can be a NET LOSS (barrier/sync overhead) when L2 already serves the shared tile — measure"
    applies_to: [gemm, stencil, reduction, conv]

  - id: cm_cooperative_slm_tiling
    name: "Form a thread group and share an input tile through SLM"
    stage: memory_access
    before: |
      // Naive: one thread per output tile, local size 1. Neighbouring tiles
      // that need the SAME input rows/columns each re-load them from HBM.
      const int tm = cm_global_id(0) * BLOCK_M;
      const int tn = cm_global_id(1) * BLOCK_N;
      for (int k0 = 0; k0 < K; k0 += BLOCK_K) {
        // ... every thread loads its own A tile AND the shared B tile from HBM
      }
    after: |
      // Raise the grid contract's work-group-size knob (named GROUP_M in THIS
      // example — use whatever YOUR contract lists; do not invent a new name)
      // above 1 so that neighbouring output tiles form ONE thread group. That
      // knob already drives local size; keep per-thread tile indexing on
      // cm_global_id so each thread still owns one distinct output tile (no
      // redundancy). The whole group shares the SAME B sub-tile each K-step, so
      // stage it in SLM once instead of once per thread. (The group size must
      // divide the staged dimension — GROUP_M | BLOCK_K here.)
      const uint lid = cm_local_id(0);              // 0..GROUP_M-1 within the group
      const int  tm  = cm_global_id(0) * BLOCK_M;   // private row base per thread
      const int  tn  = cm_group_id(1) * BLOCK_N;    // column base shared by the group
      cm_slm_init(SLM_BYTES);
      uint slm = cm_slm_alloc(SLM_BYTES);
      matrix<float, BLOCK_M, BLOCK_N> acc = 0.0f;
      for (int k0 = 0; k0 < K; k0 += BLOCK_K) {
        // Cooperative load: each thread stages BLOCK_K/GROUP_M rows of the shared
        // B tile into SLM (B half packed two-per-uint32 -> BLOCK_N/2 uints/row).
        #pragma unroll
        for (int r = 0; r < BLOCK_K / GROUP_M; r++) {
          int krow = lid * (BLOCK_K / GROUP_M) + r;
          vector<uint, BLOCK_N/2> brow =
              cm_load<uint32_t, BLOCK_N/2>(surfB, ((k0 + krow) * N + tn) * sizeof(half));
          cm_store_slm<uint, BLOCK_N/2>((krow * (BLOCK_N/2)) * sizeof(uint), brow);
        }
        cm_slm_fence(CM_GLOBAL_COHERENT_FENCE);
        cm_barrier();
        // Private A rows from HBM; shared B tile from SLM:
        matrix<half, BLOCK_M, BLOCK_K> a;
        #pragma unroll
        for (int i = 0; i < BLOCK_M; i++)
          a.row(i) = cm_load<uint32_t, BLOCK_K/2>(surfA, ((tm + i) * K + k0) * sizeof(half)).format<half>();
        matrix<half, BLOCK_K, BLOCK_N> b;
        #pragma unroll
        for (int kk = 0; kk < BLOCK_K; kk++)
          b.row(kk) = cm_load_slm<uint, BLOCK_N/2>((kk * (BLOCK_N/2)) * sizeof(uint)).format<half>();
        #pragma unroll
        for (int i = 0; i < BLOCK_M; i++)
          #pragma unroll
          for (int kk = 0; kk < BLOCK_K; kk++)
            acc.row(i) += a(i, kk) * b.row(kk);
        cm_barrier();   // WAR guard before the next K-step overwrites the SLM tile
      }
    description: |
      NAMES BELOW ARE ILLUSTRATIVE — substitute this kernel's actual identifiers.
      The work-group-size knob (shown as GROUP_M / GROUP_N) is whatever the grid
      contract lists; it is already wired into the launch's local size, so raise
      THAT knob rather than inventing a new #define. BLOCK_M / BLOCK_N / BLOCK_K
      stand for the kernel's own tile #defines.

      The high-value memory optimization for GEMM-like kernels: turn the lone
      one-thread-per-tile launch into cooperative thread groups so a tile shared
      across the group is fetched from HBM once and reused from SLM. This needs
      BOTH a launch change and a code change:
        1. Raise a cooperative work-group-size #define named by the grid contract
           (illustrated as GROUP_M; it could be WG_M, TG_M, … — use the contract's
           name) above 1. The harness sets local size from it (#groups =
           global / local); the global work size is unchanged, so there are no
           redundant threads — the threads are just regrouped. Keep per-thread
           output indexing on cm_global_id(...) (= cm_group_id*GROUP + cm_local_id)
           so each thread still owns one distinct tile.
        2. Within the group, split the cooperative load of the shared tile across
           threads by cm_local_id(...), stage it in SLM (cm_store_slm), fence +
           cm_barrier, then have every thread read it back (cm_load_slm). Grouping
           along M shares the B tile; grouping along N shares the A tile; a 2D
           group (the two work-group-size knobs) can share both.
      Constraints: the work-group-size knob must divide the staged dimension
      (e.g. the M-group size must divide the kernel's K tile) and the product of
      the work-group-size knobs must stay <= the device max work-group size. See
      cm_slm_staging for the SLM-op signatures and cm_slm_cooperative_correctness
      for the synchronization rules.
      WORTH TRYING, THEN MEASURE: cooperative SLM helps when the shared operand's
      reuse is NOT already captured by the cache hierarchy. On a part with a strong
      L2 the cache may already serve the shared rows/columns to every thread, so
      the extra cm_slm_fence + cm_barrier per K-step may or may not pay off — it
      tends to win on cache-weak parts or large working sets, and to be roughly
      neutral where the cache already provides the reuse. Treat it as a real
      candidate to benchmark against the register-blocked kernel and let the
      measurement on the target device decide; do not assume either outcome in
      advance.
    rationale: "Sharing an input tile across a group through SLM can cut that operand's HBM traffic by the group size — but a strong L2 may already provide that reuse for free, so the win is hardware-dependent and must be measured against a register-blocked baseline."
    expected_speedup: "conditional: up to ~1.5-4x on cache-weak hardware / large working sets; near-zero or a net loss when L2 already serves the shared tile — measure vs a register-blocked kernel"
    applies_to: [gemm, matmul, conv, stencil]

  - id: cm_1d_block_load
    name: "Use LSC 1D block loads for coalesced HBM access"
    stage: memory_access
    before: |
      // Scattered / gather reads (per-lane offsets or cm_load4) — poor coalescing.
      vector<uint, N> v = cm_load4<uint, ...>(surf, offsets);
    after: |
      // LSC 1D block load (stateful, by byte offset; NElts in {1,2,3,4,8,16,32,64}):
      vector<uint, NElts> v =
          cm_load<uint, NElts, DataSize::Default, CacheHint::Cached, CacheHint::Cached>(surf, byte_offset);

      // Build a 2D register tile from several CONTIGUOUS 1D row loads (one
      // cm_load per row, each a coalesced block by byte offset):
      #pragma unroll
      for (int r = 0; r < TILE_ROWS; ++r)
        tile.row(r) = cm_load<uint, TILE_ELEMS>(surf, (row0 + r) * pitch_bytes + col0_bytes);
    description: |
      Replace scattered/gather reads with explicit LSC 1D block loads so
      neighboring lanes hit contiguous memory. cm_load (1D) reads a contiguous
      block by byte offset; assemble a register tile from several contiguous 1D
      row loads (one cm_load per row) with linear byte offsets.
      NOTE: the block form needs a 32/64-bit element type (U32/U64). For
      half/bfloat16 pack two elements per uint32 and reinterpret —
      cm_load<uint32_t, NElts/2>(surf, byte_off).format<half>() — see the
      cm_block_load_requires_32bit constraint.
      LOAD WIDE, SLICE: read each row's FULL contiguous width in ONE block load
      and .select<>() sub-blocks out of it; do NOT split a contiguous row into
      several narrow per-block loads (it under-uses each LSC message). See
      cm_wide_block_access for the allowed transfer sizes and the rationale.
    rationale: "Coalesced LSC 1D block reads maximize cache-line utilization and HBM efficiency."
    expected_speedup: "1.3-2x"
    applies_to: [gemm, conv, memory_bound]

  - id: cm_wide_block_access
    name: "Coalesce into the widest LSC block load/store; slice sub-blocks in registers"
    stage: memory_access
    before: |
      // A contiguous span fetched as several NARROW block loads (one per
      // sub-block) — more LSC messages than necessary, each under-filling a
      // cache line, for exactly the same bytes.
      vector<uint, 8> lo = cm_load<uint, 8>(surf, (row * N + col)      * sizeof(half));
      vector<uint, 8> hi = cm_load<uint, 8>(surf, (row * N + col + 16) * sizeof(half));
    after: |
      // One WIDE block load over the whole contiguous span, then .select<>()
      // the sub-blocks straight from the register tile (no extra memory traffic):
      vector<uint, 16> wide = cm_load<uint, 16>(surf, (row * N + col) * sizeof(half));
      auto lo = wide.select<8, 1>(0);     // first  sub-block (cols col..col+15 as half)
      auto hi = wide.select<8, 1>(8);     // second sub-block (cols col+16..col+31)
      // Same rule for output: write the widest contiguous block once with cm_store.
    description: |
      An LSC 1D block transfer (cm_load / cm_store / cm_prefetch, addressed by a
      scalar BYTE offset) moves NElts elements in ONE message. Fewer, WIDER
      messages win: each message has a fixed issue cost and the hardware moves
      data in 64-byte cache lines, so a transfer narrower than a cache line
      wastes the rest of the line, and a contiguous region split into K narrow
      loads issues K messages for data one wide message could carry. ALWAYS
      coalesce a contiguous span into the single WIDEST block transfer the size
      rules allow, then carve sub-blocks out of the register tile with
      .select<>() / .row() instead of re-loading them. Splitting a contiguous row
      into a narrow load per sub-block is a common, silent throughput loss (it
      can roughly halve a compute-bound kernel by multiplying the message count).
      ALLOWED SIZES (CM spec, validated): NElts must be one of
      1, 2, 3, 4, 8, 16, 32, 64 — any other count is a COMPILE error. The block
      form needs a 32-/64-bit element type: with DataSize::Default the element
      type is T; an explicit DataSize override may only be U32 or U64; the byte
      offset must be DataSize-aligned.
      PACK SUB-32-BIT DATA INTO uint (this is why we load as uint, not half): a
      uint32 element carries TWO halfs/bf16 or FOUR int8, so one
      cm_load<uint, NElts> moves NElts*4 bytes = 2*NElts halfs = 4*NElts int8
      (reinterpret the register tile with .format<half>() / .format<>() — see
      cm_block_load_requires_32bit). The widest single block is NElts=64 = 256 B
      as uint32 (128 halfs / 256 int8), or 512 B as uint64. Aim to fill at least
      one 64-byte cache line per transfer, i.e. >= 16 uint32 (32 halfs); for a
      span wider than 64 elements use several 64-wide blocks, not many
      sub-cache-line ones.
    rationale: "One wide LSC block transfer issues fewer messages and fills whole cache lines; splitting a contiguous span into narrow sub-block loads multiplies the message count and wastes cache-line bandwidth for the same bytes."
    expected_speedup: "1.2-2x; coalescing sub-cache-line transfers can ~halve the load/store message count"
    applies_to: [gemm, matmul, conv, reduction, elementwise, attention, memory_bound]

  - id: cm_2d_block_load_vnni
    name: "Build DPAS operands with the untyped 2D block load -- hardware VNNI-packs B, no manual shuffle"
    stage: memory_access
    before: |
      // Stateful path: B is hand-packed into the DPAS Src1 VNNI layout in the hot
      // loop (per-row 1D loads + manual K-pair interleave) -- the dominant
      // inner-loop cost of a hand-written DPAS GEMM.
      matrix<half, DPAS_K, DPAS_N> btile;             // per-row 1D loads ...
      matrix<half, DPAS_K/2, DPAS_N*2> bv;
      for (int kp = 0; kp < DPAS_K/2; kp++) {          // manual VNNI interleave
        bv.row(kp).select<DPAS_N,2>(0) = btile.row(2*kp+0);
        bv.row(kp).select<DPAS_N,2>(1) = btile.row(2*kp+1);
      }
      vector<uint, (DPAS_K/2)*DPAS_N> bpk = bv.format<uint>();
    after: |
      // Stateless path (the kernel takes svmptr_t pointer args, built with
      // -DCM_PTRSIZE=64): the untyped 2D block load addresses each tile from a 2D
      // surface and, for B, applies the VNNI TRANSFORM in HARDWARE, so the DPAS
      // Src1 operand arrives DPAS-ready from NATURAL [K,N] B. No manual interleave
      // and no offline pre-pack.
      half *pA = (half*)A, *pB = (half*)B, *pD = (half*)D;
      // 2D surface descriptor triple = (Width_bytes-1, Height_elems-1, Pitch_bytes-1).
      const unsigned aW=(unsigned)(K*2)-1, aH=(unsigned)M-1, aP=(unsigned)(K*2)-1;
      const unsigned bW=(unsigned)(N*2)-1, bH=(unsigned)K-1, bP=(unsigned)(N*2)-1;
      // cm_ptr_load<T, BlockWidth, BlockHeight, NBlocks, Transposed, Transformed>(
      //     ptr, SurfW-1, SurfH-1, SurfPitch-1, BlockX, BlockY)
      // A: normal load of a BLOCK_M x DPAS_K panel (Transposed=false, Transformed=false)
      vector<half, BLOCK_M*DPAS_K> ablk =
          cm_ptr_load<half, DPAS_K, BLOCK_M, 1, false, false>(pA, aW, aH, aP, k0, tm);
      // B: VNNI-transform load (Transformed=true) -> DPAS-ready Src1 for one N-atom
      vector<half, DPAS_K*DPAS_N> braw =
          cm_ptr_load<half, DPAS_N, DPAS_K, 1, false, true>(pB, bW, bH, bP, tn, k0);
      vector<uint, (DPAS_K/2)*DPAS_N> bpk = braw.format<uint>();
      acc = cm_dpas<CM_PRECISION_HF, CM_PRECISION_HF, 8, RPT>(acc, bpk, apk);
      // store via cm_ptr_store<half, DPAS_N, RPT>(pD, dW, dH, dP, tn, tm, outv);
    description: |
      The untyped 2D block load is the in-kernel way to build DPAS operands
      WITHOUT a manual VNNI shuffle and WITHOUT offline packing: the hardware
      addresses the tile from a 2D surface and, with the VNNI-TRANSFORM flag,
      emits B already in the DPAS Src1 (VNNI) byte order. One normal 2D load
      fetches an A panel; one VNNI 2D load per N-atom fetches a DPAS-ready B atom
      -- far fewer instructions than per-row 1D loads + interleave. It is
      STATELESS-ONLY, so it requires svmptr_t kernel args (see
      cm_stateless_vs_stateful_access); if the kernel currently takes buffer_t
      surfaces, switch its arguments to svmptr_t to use this load.
      FUNCTION FORM (use this): cm_ptr_load<T, BlockW, BlockH, NBlocks, Transposed,
      Transformed>(ptr, SurfW_bytes-1, SurfH_elems-1, SurfPitch_bytes-1, X, Y):
        - A panel: <half, DPAS_K, BLOCK_M, 1, false, false>  (normal)
        - B atom : <half, DPAS_N, DPAS_K, 1, false, true>     (VNNI transform)
      RULES (CM spec): the surface must be LINEAR (non-tiled) / untyped; the VNNI
      transform supports only 1- and 2-byte element types (fp16/bf16/int8); the
      pitch must be >= 64 bytes; out-of-bound bytes read as 0. PREFER the function
      form over the descriptor form (lsc::block_2d_desc + cm_load<lsc::VNNI>): the
      descriptor-reuse form is faster in theory but has tripped a runtime memory
      fault (display-TDR risk) on this device -- validate it before relying on it.
      This removes the dominant manual-pack cost and is the fastest NATURAL-layout
      (no offline pre-pack) DPAS GEMM path.
      FEWER, WIDER MESSAGES: load MULTIPLE DPAS atoms per 2D message and slice them
      in registers. A 2-byte VNNI transform load allows Width up to 32 elements
      (Width*sizeof(T) <= 64 B) and NumBlocks 1/2/4, so ONE message can cover 2
      N-atoms (Width=32) instead of 1 -- .select<>() the per-atom Src1 operands out
      of the wide result. This matters most once an L2 swizzle
      (cm_l2_tile_swizzle) has made the operands cache-resident: the bottleneck
      then becomes LOAD-MESSAGE COUNT, and halving the B-load messages this way was
      a large measured win (do NOT add a software prefetch on top once the loads
      are this efficient -- it just pollutes and regresses).
    rationale: "The 2D block load's VNNI transform produces the DPAS Src1 operand in hardware from natural [K,N] B, eliminating the manual K-pair interleave that dominates a hand-packed DPAS GEMM -- available because the kernel uses stateless svmptr_t args."
    expected_speedup: "~2-3x over a manual in-kernel VNNI-pack GEMM (natural layout, no offline packing)"
    applies_to: [gemm, matmul, conv, dpas, int8, quantized]
    requires: [xmx]

  - id: cm_dtype_accumulate
    name: "Match DPAS input/accumulator dtypes (float for fp, int32 for int8)"
    stage: dtype_fix
    before: "matrix<float, R, C> a, b;  // float32 inputs fed straight into the matmul"
    after: |
      // bf16/half inputs -> float accumulate:
      matrix<half, R, C> a, b; matrix<float, R, C> acc;
      // int8 inputs (packed into uint/int) -> int32 accumulate:
      // S8/U8 operands with a vector<int, ...> accumulator via
      // cm_dpas<CM_PRECISION_S8, CM_PRECISION_U8, 8, RepeatCount>.
    description: |
      Feed DPAS with its native low-precision operands and accumulate in the
      matching wide type: bf16/half (and tf32, bf8/hf8) accumulate in float;
      int8 (S8/U8) accumulates in int32. This preserves accuracy while keeping
      the systolic array fed.
    rationale: "DPAS native input types are narrow (bf16/half/int8); wide accumulation (float/int32) preserves numerical accuracy."
    expected_speedup: "up to 2x vs float32 inputs"
    applies_to: [gemm, matmul, mixed_precision, int8, quantized]
    requires: [xmx]  # DPAS operand/accumulator dtype rule — only relevant with an XMX engine

  - id: cm_fuse_epilogue
    name: "Fuse elementwise post-ops before the store"
    stage: fusion
    before: "// Kernel writes its result; a second kernel reads it back to apply bias/activation/scale."
    after: "// Apply the elementwise post-op on the result in-register, then store once."
    description: |
      Fold elementwise post-ops (bias add, activation, scale, clamp, type
      conversion, etc.) into the kernel that produces the data so the result is
      written to HBM only once. This applies to ANY kernel followed by an
      elementwise pass — not just GEMM/FFN — including convolutions, reductions
      and pure elementwise chains.
    rationale: "Avoids an extra HBM round-trip and a second kernel enqueue."
    expected_speedup: "1.2-1.5x when the epilogue is memory-bound"
    applies_to: [gemm, conv, reduction, elementwise, activation, ffn, any]

  - id: cm_math_intrinsics_activation
    name: "Map activation/transcendental epilogues to the hardware math intrinsics"
    stage: fusion
    before: |
      // Activation open-coded with scalar/elementwise math — extra ops, and a
      // classic base bug: cm_exp is 2^x, NOT e^x (see cm_exp_log_base2).
      acc = 1.0f / (1.0f + cm_exp(-x));   // BUG: cm_exp(-x) = 2^-x, not e^-x
    after: |
      // Use the dedicated CM math intrinsics on the whole tile in-register (they
      // run on the EU extended-math / shared-function unit), then store once.
      vector<float, N> s  = cm_sigmoid(x);   // 1/(1+e^-x)   [needs CM_HAS_SIGMOID]
      vector<float, N> t  = cm_tanh(x);      //               [needs CM_HAS_TANH]
      vector<float, N> r  = cm_rsqrt(x);     // 1/sqrt(x)
      vector<float, N> iv = cm_inv(x);       // 1/x
      // Compose the common activations from them:
      //   SiLU/Swish: x * cm_sigmoid(x)
      //   GELU(tanh): 0.5f*x*(1 + cm_tanh(0.7978845608f*(x + 0.044715f*x*x*x)))
      //   exp (base e): cm_exp(x * 1.44269504f)   // cm_exp is base-2!
    description: |
      Lower activation / transcendental epilogues to the CM math intrinsics
      instead of open-coding them: cm_sigmoid, cm_tanh, cm_exp, cm_log, cm_pow,
      cm_sqrt, cm_rsqrt, cm_inv, cm_sin, cm_cos. They evaluate on the EU's
      extended-math (shared function) unit over the whole vector<>/matrix<> tile,
      so they pair naturally with epilogue fusion (cm_fuse_epilogue): apply them
      in-register on the accumulator before the single store.
      CAPABILITY GATING: cm_tanh exists only when CM_HAS_TANH is defined and
      cm_sigmoid only when CM_HAS_SIGMOID is defined; where they are absent, build
      the activation from cm_exp/cm_inv (e.g.
      sigmoid = cm_inv(1.0f + cm_exp(-x * 1.44269504f))). Most intrinsics are
      half/float only — keep activations in float, never double
      (cm_float64_forbidden). And remember cm_exp/cm_log are base-2
      (cm_exp_log_base2).
    rationale: "The EU extended-math unit computes sigmoid/tanh/exp/rsqrt directly on a tile, replacing multi-op open-coded formulas (and an extra HBM round-trip when fused into the epilogue)."
    expected_speedup: "1.2-2x for activation/transcendental-heavy epilogues"
    applies_to: [activation, fusion, ffn, attention, elementwise, gelu, silu, sigmoid, tanh, softmax]

  - id: cm_reduction_intrinsics
    name: "Use the built-in reduction intrinsics instead of manual reduction loops"
    stage: algorithmic
    before: |
      // Manual scalar reduction, element by element: serial and scalar, so it
      // idles the EU (one lane busy at a time).
      float s = 0.0f;
      #pragma unroll
      for (int i = 0; i < N; ++i) s += v(i);            // sum
      float m = v(0);
      for (int i = 1; i < N; ++i) m = cm_max(m, v(i));  // max
    after: |
      // One intrinsic reduces a whole vector<>/matrix<> to a scalar using the
      // EU reduction hardware (matrix reduces in row-major order). The template
      // arg is the accumulator/result type:
      float s  = cm_sum<float>(v);          // sum of all elements
      float p  = cm_prod<float>(v);         // product of all elements
      float mx = cm_reduced_max<float>(v);  // max element
      float mn = cm_reduced_min<float>(v);  // min element
      // Partial / axis reductions: reduce a .row()/.select<>() view, then combine
      // (e.g. per-row softmax max & denominator).
    description: |
      CM has hardware reduction intrinsics that collapse a whole
      vector<>/matrix<> to a scalar: cm_sum, cm_prod, cm_reduced_max,
      cm_reduced_min. Prefer them over hand-rolled scalar loops for reductions,
      softmax / LogSumExp denominators, norms (L2 / RMS / LayerNorm) and pooling.
      TWO rules that bite:
        - Reduction ORDER is not guaranteed — do not rely on summation order;
          floating-point results can differ slightly from a left-to-right loop.
        - These reductions (and the dot-product / sum-of-absolute-difference
          intrinsics cm_dp2/3/4, cm_sad2) are NOT permitted inside SIMD control
          flow (SIMD_IF_BEGIN / SIMD_DO_WHILE_BEGIN); there they would reduce
          only the active channels. Reduce in uniform (scalar) control flow.
    rationale: "The reduction intrinsics use the EU's reduction tree in a single instruction, versus a serial scalar loop that leaves most SIMD lanes idle."
    expected_speedup: "2-5x for reduction-bound tiles (softmax, norms, pooling)"
    applies_to: [reduction, softmax, layernorm, rmsnorm, pooling, attention]

  - id: cm_grf_register_file_size
    name: "Size the per-thread register working set to the GRF budget"
    stage: autotuning
    before: |
      // The GRF cost of a register-blocked kernel is the SUM of every
      // simultaneously-live vector<>/matrix<> object, not a single tile:
      //   acc : matrix<float, 32, 64> = 32*64*4 = 8192 B
      //   a   : matrix<half,  32, 32> = 32*32*2 = 2048 B
      //   b   : matrix<half,  32, 64> = 32*64*2 = 4096 B
      // working set ~14 KB, which exceeds the 8 KB default 128-GRF budget on
      // BMG+ (see the cm_register_file_budget constraint), so this spills.
      matrix<float, 32, 64> acc = 0.0f;
    after: |
      // Either shrink the tile so the working set fits the budget, or raise the
      // register file to 256 registers (16 KB on BMG+, double the budget) when
      // the bigger tile is worth the lower occupancy. A single small tile like
      // this one is only
      // 16*32*4 = 2048 B — it fits the default budget easily and does NOT need
      // large GRF.
      matrix<float, 16, 32> acc = 0.0f;
    description: |
      The register-file size is selected by the -Qxcm_register_file_size build
      option (not a source construct): 128 registers by default, or 256 in
      "large GRF" mode. On BMG+ (Battlemage / Xe2+, 64 B/register) that is an
      8 KB per-thread budget at 128 GRF and 16 KB at 256 GRF. Sweep it as a
      "grf" knob TOGETHER with the tile/block
      sizes, because the two interact: a larger register file lets a big
      register-blocked tile stay resident instead of spilling, but it halves the
      number of resident threads (lower occupancy and latency hiding). Use the
      per-thread budget accounting (see the cm_register_file_budget constraint)
      to judge whether a given tile actually needs the larger file. Allowed
      values are platform-dependent (see cm_autotune_register_file_size_values).
    rationale: "A bigger register file trades occupancy for capacity, so it only helps tiles whose live set spills the default budget; pairing it with the tile size and measuring is the only way to know."
    expected_speedup: "1.1-2x for register-blocked GEMM/DPAS kernels that spill at the default register-file size"
    applies_to: [gemm, matmul, conv, dpas, reduction, any]

constraints:
  # Foundational framing rendered in EVERY stage (keyword-free id -> all stages).
  - id: cm_explicit_simd_model
    name: "CM is explicit SIMD: one thread is a whole SIMD vector (a 'warp'), not one lane"
    description: |
      Foundational mental model — keep it in EVERY stage, not just device tuning.
      C for Metal is EXPLICIT-SIMD, unlike SIMT (CUDA / Triton / Gluon): you do
      NOT write the body of one scalar lane and let the hardware replicate it
      across a warp. You write ONE thread that operates directly on whole
      vector<>/matrix<> objects, and the SIMD lanes ARE the elements of those
      operands.
        // WRONG (SIMT model): a scalar per-lane body -> SIMD1, idles the EU
        int lane = cm_local_id(0);            // NOT a lane index
        float x = a[lane] * b[lane];          // scalar ops
        // RIGHT (explicit SIMD): whole-vector ops -> one wide SIMD instruction
        vector<float,32> va = cm_load<float,32>(a_surf, off);
        vector<float,32> vx = va * vb;        // one SIMD32 multiply
      Consequences that hold in ALL stages (algorithmic, dtype_fix, fusion,
      memory_access, device_specific, autotuning):
        - "1 thread" == the whole SIMD vector == a warp/program-equivalent of
          work, NOT one lane. Launching N threads launches N SIMD vectors.
        - cm_global_id / cm_local_id / cm_group_id index THREADS (which TILE of
          work this thread owns) — never lanes.
        - There is no LANES / EXEC_SIZE #define. SIMD width is per-instruction and
          follows OPERAND width, so widen vector<>/matrix<> to get wider SIMD
          (cm_dpas is the fixed-width exception — tune it via RepeatCount / tile
          size). See the cm_simd_width pattern.
        - Express data parallelism by operand WIDTH, and size per-thread tiles to
          the register budget (see cm_register_file_budget) — not by a lane count.
        - Divergent per-element control flow uses the SIMD control-flow macros
          (SIMD_IF_BEGIN/…); such a block's SIMD width must be a power of two in
          2..32. Scalar control flow is uniform across all channels.
    severity: info

  - id: cm_float64_forbidden
    name: "Avoid float64 (double) in CM kernels"
    description: "Double precision is extremely slow on Intel GPUs; use float/half/bfloat16."
    severity: critical

  - id: cm_exp_log_base2
    name: "cm_exp and cm_log are BASE-2 (2^x and log2 x), not natural exp/ln"
    description: |
      CRITICAL silent-correctness trap: the CM hardware math intrinsics cm_exp
      and cm_log work in BASE 2, matching the EU's native exp2/log2 units:
        cm_exp(x)  ==  2^x       (NOT e^x)
        cm_log(x)  ==  log2(x)   (NOT ln x)
      A softmax / attention / LogSumExp / GELU that calls cm_exp(x) expecting
      e^x is WRONG on every element. Convert with the standard scaling factors:
        e^x    ->  cm_exp(x * 1.44269504f)    // 1.4426950408889634 = log2(e)
        ln(x)  ->  cm_log(x) * 0.69314718f    // 0.6931471805599453 = ln 2
        a^x    ->  cm_exp(x * cm_log(a))
      Prefer folding the log2(e) factor into a preceding scale so the base
      conversion is FREE (e.g. fold the 1/sqrt(d) attention scale and log2(e)
      into one multiply before cm_exp). Only exp and log are base-2 —
      cm_pow / cm_sqrt / cm_rsqrt / cm_inv / cm_sin / cm_cos are ordinary.
    severity: critical

  - id: cm_slm_cooperative_correctness
    name: "Shared Local Memory needs a real thread group and correct synchronization"
    description: |
      Rules whenever a kernel uses SLM / cm_barrier (apply in any stage):
        - SLM and cm_barrier do NOTHING useful for a one-thread group. They pay
          off only when a cooperative work-group-size knob (the launch local
          size) is > 1; otherwise they are pure overhead. Form the group via the
          grid-contract knobs — see the cm_cooperative_slm_tiling pattern.
        - Order writes before a barrier: cm_slm_fence(CM_GLOBAL_COHERENT_FENCE)
          THEN cm_barrier(). A barrier without the preceding fence can read stale
          SLM. Reusing an SLM region also needs a trailing cm_barrier so no thread
          overwrites data others are still reading (write-after-read hazard).
        - NEVER place cm_barrier in divergent control flow (a branch/loop not
          entered uniformly by every thread in the group): threads that skip the
          barrier deadlock the group — on this device that can trip a display
          TDR/reset.
        - Per-group SLM is capped by cm_slm_init: <= 64 KB per group AND <= the
          device local memory size; the product of the work-group-size knobs must
          stay <= the device max work-group size (1024 on Xe-LPG / ARL).
        - LSC SLM ops cm_store_slm / cm_load_slm take a SCALAR BYTE offset and a
          power-of-two element count <= 64 (NOT an address vector) — see
          cm_slm_staging.
    severity: critical

  - id: cm_register_file_budget
    name: "Compute the per-thread register budget and keep the live tile set within it"
    description: |
      Every vector<>/matrix<> object lives in the thread's General Register
      File; a live working set larger than the budget spills to memory and
      collapses performance. The per-thread budget is (register count) x
      (register width):
        - register count = 128 by default, or 256 in "large GRF" mode (selected
          by the -Qxcm_register_file_size build option);
        - register width = 32 B on Xe-LP / Xe-HPG (Arc, Alchemist, and the
          Xe-LPG iGPU in Meteor / Arrow Lake), 64 B on Xe-HPC (PVC) and Xe2+
          (Battlemage / BMG and later).
      So on BMG+ (Xe2+, 64 B/register) the default 128-GRF budget is 8 KB and
      large-GRF (256) is 16 KB; on the 32 B/register parts it is 4 KB / 8 KB.
      Estimate usage as the SUM of all simultaneously-live
      tiles (accumulator + operands + unrolled temporaries), each elements x
      dtype bytes, and keep that total under the budget. A single small tile
      rarely spills; spills come from large register-blocked working sets. If a
      kernel spills — OR holds a large/numerous live tile set that is close to
      the budget even before an actual spill — either shrink the tile / split the
      K-loop to use fewer registers, OR select the LARGE register file by adding
      a build directive at the TOP of the source (it is a comment, valid before
      #include; the harness honors it on every compile):
        // xe-forge-build: -Qxcm_register_file_size=256
      The large file doubles the per-thread budget but HALVES the resident-thread
      count (occupancy), so it pays for large-tile / high-reuse kernels and hurts
      small-tile / high-occupancy ones — measure. ``=auto`` lets the compiler
      pick the large file only on a detected spill; ``=256`` forces it (use the
      forced form to grow the tile BEFORE the compiler would spill). Valid values
      are platform-dependent (128 and 256 on current Arc / Xe-LPG / BMG parts).
    severity: critical

  - id: cm_coalesced_contiguous_access
    name: "Keep global memory access coalesced via LSC 1D block loads"
    description: |
      Prefer LSC 1D block access (cm_load by byte offset) over gather/scatter
      (cm_load4 / per-lane offsets) so a SIMD memory op maps to contiguous HBM
      and full cache lines.
    severity: warning

  - id: cm_block_load_requires_32bit
    name: "LSC block loads/stores need a 32- or 64-bit element type — pack 16/8-bit data"
    description: |
      cm_load<T, N>(surf, byte_offset) and cm_store<T, N>(...) addressed by a
      scalar byte offset compile to an LSC transposed/block message, which the
      hardware supports ONLY for U32 and U64 element sizes. A 16-bit element
      type fails to compile with:
        "Transposed load can work only with U32 and U64 data sizes".
      For half/bfloat16, pack two elements per uint32: move N/2 uint elements
      and reinterpret with .format<>():
        a.row(i) = cm_load<uint32_t, N/2>(surf, byte_off).format<half>();   // load
        cm_store<uint32_t, N/2>(surf, byte_off, row.format<uint32_t>());     // store
      (Pack four 8-bit elements per uint32 the same way.) The gather/scatter
      forms (cm_load4 / per-lane offsets) have no such restriction but coalesce
      worse -- prefer the packed block load.
    severity: critical

  - id: cm_stateless_vs_stateful_access
    name: "The kernel's pointer-arg type picks the memory model: svmptr_t = stateless, buffer_t = stateful"
    description: |
      A CM kernel argument is EITHER a stateful surface or a stateless pointer,
      and that choice decides which LSC memory API the kernel may use. Match the
      ops to the arg type -- crossing them does not compile.

      STATELESS -- `svmptr_t A` (a raw 64-bit pointer; needs the build option
      -DCM_PTRSIZE=64, which this project sets by default). Cast it to a typed
      pointer (`half *pA = (half*)A;`) and use the STATELESS LSC ops:
        - 1D block:  cm_ptr_load<T, NElts>(ptr, byte_offset) / cm_ptr_store<...>
          (same NElts {1,2,3,4,8,16,32,64} and byte-offset rules as cm_load)
        - 2D block:  the untyped 2D block load/store, INCLUDING the VNNI-transform
          load that packs a DPAS Src1 operand in HARDWARE -- see
          cm_2d_block_load_vnni (the fastest natural-layout DPAS GEMM path)
        - gather/scatter and the descriptor form (lsc::block_2d_desc) also live here.
      When the kernel's arguments are svmptr_t, the full stateless API -- crucially
      the 2D HW-VNNI load -- is available; prefer it over a manual in-kernel VNNI
      shuffle.

      STATEFUL -- `SurfaceIndex surfA [[type("buffer_t")]]` (a binding-table
      index). Use the STATEFUL ops: cm_load<T, NElts>(surf, byte_offset) /
      cm_store / cm_load4 gather. The untyped 2D block engine and its VNNI
      transform are NOT available statefully, so a stateful DPAS GEMM must
      hand-pack B (manual K-pair interleave) -- the very cost the stateless
      2D-VNNI load removes.

      ONE ABI, ONE MODEL: never pass a buffer_t to a stateless op or a pointer to
      a stateful op. To unlock the 2D HW-VNNI load on a buffer_t kernel, switch
      its args to svmptr_t; both bind to the same host buffer, so correctness is
      unaffected.
    severity: info

  - id: cm_autotune_register_file_size_values
    name: "-Qxcm_register_file_size only accepts platform-specific values"
    description: |
      The GRF register-file size (-Qxcm_register_file_size=<value>) must be one
      of the values the target platform supports; an unsupported value fails the
      build. Allowed values:
        - pre-XeHP (Gen12LP / Xe-LP, e.g. TGL, DG1): 128 only.
        - XeHP through Xe2 (Xe-HPG/Alchemist/DG2, Xe-HPC/PVC, Xe-LPG/Meteor &
          Arrow Lake, Xe2/Battlemage): 128, 256, or auto.
        - Xe3 and later: 32, 64, 96, 128, 160, 192, 256, or auto.
      When the exact architecture is unknown, 128 (default) and 256 ("large
      GRF") are valid on every XeHP-and-later part.
    severity: warning

  - id: cm_vector_matrix_views
    name: "CM vector/matrix manipulation reference: views, slices, references, reshapes"
    description: |
      Reference (NOT a prohibition) for how CM vector<>/matrix<> data is sliced,
      viewed, reshaped and combined. CM has NO pointers, arrays or C++ references —
      every in-thread data movement is expressed with these member functions on
      vector<T,N> / matrix<T,R,C> and their reference views. Getting the template
      parameter ORDER or the view-vs-copy semantics wrong silently corrupts results,
      so consult this before emitting any .select / .row / .column / .format /
      .replicate / .iselect / .merge call.

      BASE OBJECTS vs REFERENCE OBJECTS (views)
        - vector<T, N> / matrix<T, R, C> are BASE objects: they OWN GRF storage.
          N and R*C must be compile-time constants and the whole object must fit
          the per-thread GRF (see cm_register_file_budget).
        - vector_ref<T, N> / matrix_ref<T, R, C> are VIEWS: they own NO storage,
          they ALIAS a region of some base object. Every read/write through a view
          hits the base object's elements. Use a view to read or modify a sub-region
          IN PLACE; use a base object when you want an independent copy.
        - select / select_all / row / column / format all RETURN a *_ref view, so
          they are valid L-VALUES:  a.select<4,2>(0) = b;  writes into a.
        - iselect and replicate RETURN A NEW (copy) vector — they are NOT views and
          CANNOT appear on the left-hand side of an assignment.
        - A vector_ref / matrix_ref constructor only accepts a vector/matrix (or
          view) of the SAME type and size whose elements are CONTIGUOUS:
            matrix<float,8,4> m1;
            vector_ref<float,4> v1(m1.row(2));   // v1 aliases row 2 of m1

      ELEMENT ACCESS (returns a scalar l-value)
        v(i)      m(i, j)        // function-call style
        v[i]      m[i][j]        // array style (i = row, j = column)

      SELECT — strided sub-vector / sub-matrix (returns a VIEW)
        vector:  v.select<SIZE, STRIDE>(offset = 0)
            // SIZE elements, STRIDE apart, starting at offset
            b = a.select<4,2>(1);    // -> a(1), a(3), a(5), a(7)
            a.select<4,2>(0) = b;    // write b into a(0), a(2), a(4), a(6)
        matrix:  m.select<V_SIZE, V_STRIDE, H_SIZE, H_STRIDE>(i = 0, j = 0)
            // V_* selects rows, H_* selects columns; (i,j) = start row,col
            m2 = m1.select<2,2,2,4>(1,2);     // strided 2x2 sub-matrix
            m1.select<4,1,4,2>(0,0) = 0.0f;   // zero a strided region in place
        RESTRICTIONS: every stride must be > 0, and the stride MUST be 1 whenever
        the matching size is 1. Out-of-bound select is allowed as an optimization
        (out-of-bound elements are don't-cares and must not affect correctness).
        select_all(): a view of the WHOLE object (for a matrix it equals
        select<R,1,C,1>(0,0)); handy to pass a base object where a
        matrix_ref<T,R,C> parameter is expected.

      ROW / COLUMN (returns a VIEW)
        v = m.row(2);        // 2nd row as a vector_ref
        m.column(3) = 0;     // zero the 3rd column in place

      FORMAT — reinterpret element type and/or reshape (returns a VIEW)
        obj.format<T>()             // view as a flat vector<T, ...>
        obj.format<T, R, C>()       // view as a matrix<T, R, C>
        The object must be CONTIGUOUS and ALIGNED and the new byte size must not
        exceed the source. This is how 16/8-bit data rides 32-bit LSC block loads
        (see cm_block_load_requires_32bit):
            tile.row(r) = cm_load<uint32_t, N/2>(surf, off).format<half>();   // load
            cm_store<uint32_t, N/2>(surf, off, row.format<uint32_t>());       // store

      REPLICATE — broadcast a region into a NEW vector (copy; row-major order)
        x.replicate<REP>()                  // whole object, REP times
        x.replicate<REP, W>(i [,j])         // REP copies of W contiguous elements
        x.replicate<REP, VS, W>(i [,j])     // REP blocks of W, each block VS apart
        x.replicate<REP, VS, W, HS>(i [,j]) // ... plus intra-block element stride HS

      ISELECT — gather by index into a NEW vector (copy; NOT an l-value)
        vector<ushort, K> idx;               // index type MUST be ushort
        out = in.iselect(idx);               // out(k) = in(idx(k)); len(out)=len(idx)
        out = m.iselect(rowIdx, colIdx);     // out(k) = m(rowIdx(k), colIdx(k));
                                             // rowIdx and colIdx must be equal length

      MASKS, COMPARISON, MERGE, BOOLEAN REDUCTIONS
        - Comparisons are component-wise and produce a ushort MASK (0 / 1):
            vector<ushort,N> nz = (v != 0);    matrix<ushort,R,C> ge = (a >= b);
        - merge = masked move performed IN PLACE on the invoking object:
            dst.merge(src, mask);             // where mask set -> dst = src
            dst.merge(srcX, srcY, mask);      // mask set -> srcX else srcY
          mask may be an int (bit-packed) or a vector/matrix<ushort>. In MERGE only
          the LSB of each mask element is significant; in SIMD control flow ANY
          non-zero element is "true" — do not conflate the two rules.
        - Boolean reductions collapse a mask to a scalar usable in ordinary
          (scalar) if/while:  mask.any()  -> 1 if any element non-zero;
          mask.all() -> 1 if all non-zero.  e.g.  if ((a == 0).any()) { ... }

      WHOLE-OBJECT ARITHMETIC / ASSIGNMENT
        +, -, *, /, %, <<, >>, &, |, ^, ~ and their op= forms are all component-wise;
        a scalar operand is broadcast to every element. Mixed shapes are allowed iff
        the TOTAL element count matches — elements pair up in ROW-MAJOR order:
            m2 = m1 - v1;   // v1[0..C-1] -> m1.row(0), v1[C..2C-1] -> m1.row(1), ...
        All operands are read BEFORE the destination is written, so assignments
        through overlapping views are well defined (v2 = v1 + v2 with aliasing views
        uses the pre-update values).

      INITIALIZING SEQUENCES (compile-time friendly; prefer over per-element stores)
        const ushort a0_7[8] = {0,1,2,3,4,5,6,7};
        vector<ushort,8> v(a0_7);                 // C array initializer
        #include <cm/cmtl.h>
        cm_vector(v, ushort, 16, 2, 3);           // DECLARES + fills v = 2,5,8,...
        cm_matrix(m, ushort, 4, 8, 10, 5);        // DECLARES + fills m = 10,15,20,...
        cmtl::cm_vector_assign(v.select<10,1>(2), i, 3);  // fill an existing slice
        (cm_vector / cm_matrix DECLARE the variable themselves — do NOT declare it
        beforehand; cm_vector_assign needs an already-declared vector or view.)
    severity: info
