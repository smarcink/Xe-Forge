# CM ("C for Metal") optimization patterns for Intel Xe GPUs.
#
# Loaded only when KNOWLEDGE_BASE_ENABLED=true (and DSL=cm). The loader reads
# the top-level `patterns:` and `constraints:` lists; each pattern needs a
# valid `stage` (analysis, algorithmic, dtype_fix, fusion, memory_access,
# device_specific, autotuning, discovery).

patterns:
  - id: cm_dpas_matmul
    name: "Use the DPAS (XMX) systolic array for the matmul inner product"
    stage: device_specific
    before: |
      // Scalar/vector MAC loop over K — leaves the DPAS/XMX array idle.
      for (int k = 0; k < K; ++k)
        acc += a_row[k] * b_col[k];
    after: |
      // Map the K inner product onto cm_dpas. SystolicDepth must be 8; the K
      // dimension is SystolicDepth * OpsPerChannel (8*2=16 for bf16/half,
      // 8*4=32 for int8). Operands are packed into uint/int GRF registers.
      // cm_dpas<Src1Prec, Src2Prec, SystolicDepth, RepeatCount, ResTy>(Acc, Src1=B, Src2=A)

      // bf16/half inputs -> float accumulate:
      matrix<float, RepeatCount, 16> acc = 0;
      acc = cm_dpas<CM_PRECISION_BF, CM_PRECISION_BF, 8, RepeatCount>(
                acc, B.format<uint>(), A.format<uint>());

      // int8 inputs -> int32 accumulate (S8 weights x U8 activations):
      matrix<int, RepeatCount, 16> iacc = 0;
      iacc = cm_dpas<CM_PRECISION_S8, CM_PRECISION_U8, 8, RepeatCount>(
                iacc, weights.format<uint>(), input.format<uint>());
    description: |
      The Xe DPAS/XMX (Dot Product Accumulate Systolic) array delivers the bulk
      of matmul throughput. Express the K-loop inner product as cm_dpas. It
      supports bf16/half (-> float accumulate) and int8 S8/U8 (-> int32
      accumulate), plus tf32, bf8/hf8 and int2/int4 on capable hardware (each
      guarded by a CM_HAS_DPAS* macro). SystolicDepth is fixed at 8; RepeatCount
      (1..8) sets the number of A rows processed per instruction.
    rationale: "DPAS provides far higher MAC throughput than scalar/vector FMA on the EU, for both float and integer matmul."
    expected_speedup: "3-10x for GEMM-like inner loops"
    applies_to: [gemm, matmul, conv, dpas, int8, quantized]
    requires: [xmx]  # needs the XMX/DPAS systolic array (absent on Xe-LPG / MTL / ARL)

  - id: cm_simd_width
    name: "Widen vectors/matrices to let the compiler emit wider SIMD"
    stage: device_specific
    before: |
      // SIMD width is per-instruction on Intel GPUs and follows the operand
      // width. Narrow per-thread vectors force narrow SIMD instructions that
      // under-utilize the EU.
      vector<float, 8> v = ...;   // tends to compile to a narrow SIMD op
    after: |
      // Operate on wider vectors/matrices so the backend can select wider
      // SIMD (e.g. SIMD16/SIMD32) instructions and amortize control overhead.
      vector<float, 32> v = ...;  // wider operand -> wider SIMD instruction
      // NOTE: there is no LANES/EXEC_SIZE #define that "sets" SIMD width.
      // Fixed-size systolic ops are the exception: cm_dpas runs at a fixed
      // execution size (e.g. 16); tune its throughput via RepeatCount / tile
      // size, not by changing SIMD width.
    description: |
      On the Intel GPU ISA the SIMD width is chosen per instruction and is
      driven by the width of the vector/matrix being operated on — wider
      operands give the compiler the chance to issue wider SIMD instructions.
      It is not selected by a macro/define. Size per-thread vectors/matrices to
      keep the EU busy without spilling the GRF.
    rationale: "Wider operands let the backend pick wider SIMD, raising lane utilization and hiding instruction latency."
    expected_speedup: "1.2-2x"
    applies_to: [elementwise, gemm, reduction]

  - id: cm_loop_unroll
    name: "Unroll tight, compile-time-bounded inner loops with #pragma unroll"
    stage: device_specific
    before: |
      // Rolled inner loop: a per-iteration branch + induction-variable update,
      // and the runtime index blocks static GRF addressing of register tiles.
      for (int k = 0; k < K; k += TILE_K)
        acc = cm_dpas<CM_PRECISION_BF, CM_PRECISION_BF, 8, M>(acc, b, a);
    after: |
      // Fully unroll small loops whose trip count is a compile-time constant.
      // This removes loop control overhead, turns the index into a constant
      // (required for static .select<>()/.row() GRF addressing), keeps the
      // accumulator register-resident, and lets the scheduler interleave loads
      // with DPAS to hide latency. Unroll tight chunk loops like this:
      #pragma unroll
      for (int t = 0; t < NUM_TILES; t++)          // NUM_TILES is a compile-time constant
        tile.row(t) = cm_load<uint, TILE_ELEMS>(surf, offset[t]);

      // Use a PARTIAL factor when full unroll would be too large:
      #pragma unroll 4
      for (int k = 0; k < K; k += TILE_K) { /* ... */ }

      // And keep LARGE / runtime-bounded loops rolled to bound code size and
      // register pressure:
      #pragma nounroll
      for (int i = 0; i < num_iters; i++) { /* ... */ }
    description: |
      #pragma unroll (optionally "#pragma unroll N" for a partial factor) tells
      the compiler to unroll the next loop; #pragma nounroll forbids it. Full
      unrolling needs a compile-time-constant trip count.
      Benefits: removes branch/induction overhead; makes loop indices constant
      so register tiles can be addressed statically with .select<>()/.row()
      (often REQUIRED, not just faster); exposes more instruction-level
      parallelism so loads and DPAS pipeline together.
      Consequences: more unrolling means a larger instruction footprint and
      more simultaneously-live values, which raises GRF pressure and can cause
      register spills that collapse performance (see cm_register_file_budget).
      When useful: tight inner loops with small, fixed bounds — e.g. the K/TILE_K
      DPAS loop and tile-chunk loops. Prefer #pragma nounroll or a small
      partial factor for long or runtime-bounded loops.
    rationale: "Unrolling tight constant-bound loops cuts control overhead, enables static GRF indexing, and pipelines loads with DPAS — but over-unrolling spills the GRF."
    expected_speedup: "1.1-1.5x for tight inner loops (and can be required for static GRF indexing)"
    applies_to: [gemm, conv, reduction, dpas, elementwise]

  - id: cm_slm_staging
    name: "Stage reused tiles through SLM with LSC SLM ops"
    stage: memory_access
    before: "// Every thread re-reads the same A/B tile from HBM (redundant global traffic)."
    after: |
      // Cooperatively stage the shared tile in SLM once, then read it back.
      cm_slm_init(SLM_BYTES);
      uint slm = cm_slm_alloc(SLM_BYTES);
      // LSC SLM store of the cooperatively-loaded tile:
      cm_store_slm<uint, N>(slm_offsets, tile);
      cm_slm_fence(CM_GLOBAL_COHERENT_FENCE);   // order SLM writes
      cm_barrier();                             // make them visible to the group
      // LSC SLM load back into registers:
      vector<uint, N> staged = cm_load_slm<uint, VectorSize::N1>(slm_offsets);
    description: |
      Use Shared Local Memory to reuse tiles across a thread group and cut HBM
      traffic. Allocate with cm_slm_init / cm_slm_alloc, move data with the LSC
      SLM ops (cm_store_slm / cm_load_slm), and synchronize with cm_slm_fence
      + cm_barrier.
    rationale: "SLM bandwidth is much higher than HBM; group-level reuse amortizes global loads."
    expected_speedup: "1.5-3x for memory-bound tiles"
    applies_to: [gemm, stencil, reduction, conv]

  - id: cm_1d_block_load
    name: "Use LSC 1D block loads for coalesced HBM access"
    stage: memory_access
    before: |
      // Scattered / gather reads (per-lane offsets or cm_load4) — poor coalescing.
      vector<uint, N> v = cm_load4<uint, ...>(surf, offsets);
    after: |
      // LSC 1D block load (stateful, by byte offset; NElts in {1,2,4,8,16,32,64}):
      vector<uint, NElts> v =
          cm_load<uint, NElts, DataSize::Default, CacheHint::Cached, CacheHint::Cached>(surf, byte_offset);

      // Build a 2D register tile from several CONTIGUOUS 1D row loads (one
      // cm_load per row, each a coalesced block by byte offset):
      #pragma unroll
      for (int r = 0; r < TILE_ROWS; ++r)
        tile.row(r) = cm_load<uint, TILE_ELEMS>(surf, (row0 + r) * pitch_bytes + col0_bytes);
    description: |
      Replace scattered/gather reads with explicit LSC 1D block loads so
      neighboring lanes hit contiguous memory. cm_load (1D) reads a contiguous
      block by byte offset; assemble a register tile from several contiguous 1D
      row loads (one cm_load per row) with linear byte offsets.
      NOTE: the block form needs a 32/64-bit element type (U32/U64). For
      half/bfloat16 pack two elements per uint32 and reinterpret —
      cm_load<uint32_t, NElts/2>(surf, byte_off).format<half>() — see the
      cm_block_load_requires_32bit constraint.
    rationale: "Coalesced LSC 1D block reads maximize cache-line utilization and HBM efficiency."
    expected_speedup: "1.3-2x"
    applies_to: [gemm, conv, memory_bound]

  - id: cm_dtype_accumulate
    name: "Match DPAS input/accumulator dtypes (float for fp, int32 for int8)"
    stage: dtype_fix
    before: "matrix<float, R, C> a, b;  // float32 inputs fed straight into the matmul"
    after: |
      // bf16/half inputs -> float accumulate:
      matrix<half, R, C> a, b; matrix<float, R, C> acc;
      // int8 inputs (packed into uint/int) -> int32 accumulate:
      // S8/U8 operands with a vector<int, ...> accumulator via
      // cm_dpas<CM_PRECISION_S8, CM_PRECISION_U8, 8, RepeatCount>.
    description: |
      Feed DPAS with its native low-precision operands and accumulate in the
      matching wide type: bf16/half (and tf32, bf8/hf8) accumulate in float;
      int8 (S8/U8) accumulates in int32. This preserves accuracy while keeping
      the systolic array fed.
    rationale: "DPAS native input types are narrow (bf16/half/int8); wide accumulation (float/int32) preserves numerical accuracy."
    expected_speedup: "up to 2x vs float32 inputs"
    applies_to: [gemm, matmul, mixed_precision, int8, quantized]
    requires: [xmx]  # DPAS operand/accumulator dtype rule — only relevant with an XMX engine

  - id: cm_fuse_epilogue
    name: "Fuse elementwise post-ops before the store"
    stage: fusion
    before: "// Kernel writes its result; a second kernel reads it back to apply bias/activation/scale."
    after: "// Apply the elementwise post-op on the result in-register, then store once."
    description: |
      Fold elementwise post-ops (bias add, activation, scale, clamp, type
      conversion, etc.) into the kernel that produces the data so the result is
      written to HBM only once. This applies to ANY kernel followed by an
      elementwise pass — not just GEMM/FFN — including convolutions, reductions
      and pure elementwise chains.
    rationale: "Avoids an extra HBM round-trip and a second kernel enqueue."
    expected_speedup: "1.2-1.5x when the epilogue is memory-bound"
    applies_to: [gemm, conv, reduction, elementwise, activation, ffn, any]

  - id: cm_grf_register_file_size
    name: "Size the per-thread register working set to the GRF budget"
    stage: autotuning
    before: |
      // The GRF cost of a register-blocked kernel is the SUM of every
      // simultaneously-live vector<>/matrix<> object, not a single tile:
      //   acc : matrix<float, 32, 64> = 32*64*4 = 8192 B
      //   a   : matrix<half,  32, 32> = 32*32*2 = 2048 B
      //   b   : matrix<half,  32, 64> = 32*64*2 = 4096 B
      // working set ~14 KB, which exceeds the ~4-8 KB default register budget
      // (see the cm_register_file_budget constraint), so this spills.
      matrix<float, 32, 64> acc = 0.0f;
    after: |
      // Either shrink the tile so the working set fits the budget, or raise the
      // register file to 256 registers (double the budget) when the bigger tile
      // is worth the lower occupancy. A single small tile like this one is only
      // 16*32*4 = 2048 B — it fits the default budget easily and does NOT need
      // large GRF.
      matrix<float, 16, 32> acc = 0.0f;
    description: |
      The register-file size is selected by the -Qxcm_register_file_size build
      option (not a source construct): 128 registers by default, or 256 in
      "large GRF" mode. Sweep it as a "grf" knob TOGETHER with the tile/block
      sizes, because the two interact: a larger register file lets a big
      register-blocked tile stay resident instead of spilling, but it halves the
      number of resident threads (lower occupancy and latency hiding). Use the
      per-thread budget accounting (see the cm_register_file_budget constraint)
      to judge whether a given tile actually needs the larger file. Allowed
      values are platform-dependent (see cm_autotune_register_file_size_values).
    rationale: "A bigger register file trades occupancy for capacity, so it only helps tiles whose live set spills the default budget; pairing it with the tile size and measuring is the only way to know."
    expected_speedup: "1.1-2x for register-blocked GEMM/DPAS kernels that spill at the default register-file size"
    applies_to: [gemm, matmul, conv, dpas, reduction, any]

constraints:
  # Foundational framing rendered in EVERY stage (keyword-free id -> all stages).
  - id: cm_explicit_simd_model
    name: "CM is explicit SIMD: one thread is a whole SIMD vector (a 'warp'), not one lane"
    description: |
      Foundational mental model — keep it in EVERY stage, not just device tuning.
      C for Metal is EXPLICIT-SIMD, unlike SIMT (CUDA / Triton / Gluon): you do
      NOT write the body of one scalar lane and let the hardware replicate it
      across a warp. You write ONE thread that operates directly on whole
      vector<>/matrix<> objects, and the SIMD lanes ARE the elements of those
      operands.
        // WRONG (SIMT model): a scalar per-lane body -> SIMD1, idles the EU
        int lane = cm_local_id(0);            // NOT a lane index
        float x = a[lane] * b[lane];          // scalar ops
        // RIGHT (explicit SIMD): whole-vector ops -> one wide SIMD instruction
        vector<float,32> va = cm_load<float,32>(a_surf, off);
        vector<float,32> vx = va * vb;        // one SIMD32 multiply
      Consequences that hold in ALL stages (algorithmic, dtype_fix, fusion,
      memory_access, device_specific, autotuning):
        - "1 thread" == the whole SIMD vector == a warp/program-equivalent of
          work, NOT one lane. Launching N threads launches N SIMD vectors.
        - cm_global_id / cm_local_id / cm_group_id index THREADS (which TILE of
          work this thread owns) — never lanes.
        - There is no LANES / EXEC_SIZE #define. SIMD width is per-instruction and
          follows OPERAND width, so widen vector<>/matrix<> to get wider SIMD
          (cm_dpas is the fixed-width exception — tune it via RepeatCount / tile
          size). See the cm_simd_width pattern.
        - Express data parallelism by operand WIDTH, and size per-thread tiles to
          the register budget (see cm_register_file_budget) — not by a lane count.
        - Divergent per-element control flow uses the SIMD control-flow macros
          (SIMD_IF_BEGIN/…); such a block's SIMD width must be a power of two in
          2..32. Scalar control flow is uniform across all channels.
    severity: info

  - id: cm_float64_forbidden
    name: "Avoid float64 (double) in CM kernels"
    description: "Double precision is extremely slow on Intel GPUs; use float/half/bfloat16."
    severity: critical

  - id: cm_register_file_budget
    name: "Compute the per-thread register budget and keep the live tile set within it"
    description: |
      Every vector<>/matrix<> object lives in the thread's General Register
      File; a live working set larger than the budget spills to memory and
      collapses performance. The per-thread budget is (register count) x
      (register width):
        - register count = 128 by default, or 256 in "large GRF" mode (selected
          by the -Qxcm_register_file_size build option);
        - register width = 32 B on Xe-LP / Xe-HPG (Arc, Alchemist, and the
          Xe-LPG iGPU in Meteor / Arrow Lake), 64 B on Xe-HPC (PVC) and Xe2+.
      So the default budget is ~4 KB (32 B/reg) or ~8 KB (64 B/reg); large-GRF
      mode doubles it. Estimate usage as the SUM of all simultaneously-live
      tiles (accumulator + operands + unrolled temporaries), each elements x
      dtype bytes, and keep that total under the budget. A single small tile
      rarely spills; spills come from large register-blocked working sets. If a
      kernel spills, shrink the tile, split the K-loop, or raise the
      register-file size (at the cost of occupancy).
    severity: critical

  - id: cm_coalesced_contiguous_access
    name: "Keep global memory access coalesced via LSC 1D block loads"
    description: |
      Prefer LSC 1D block access (cm_load by byte offset) over gather/scatter
      (cm_load4 / per-lane offsets) so a SIMD memory op maps to contiguous HBM
      and full cache lines.
    severity: warning

  - id: cm_block_load_requires_32bit
    name: "LSC block loads/stores need a 32- or 64-bit element type — pack 16/8-bit data"
    description: |
      cm_load<T, N>(surf, byte_offset) and cm_store<T, N>(...) addressed by a
      scalar byte offset compile to an LSC transposed/block message, which the
      hardware supports ONLY for U32 and U64 element sizes. A 16-bit element
      type fails to compile with:
        "Transposed load can work only with U32 and U64 data sizes".
      For half/bfloat16, pack two elements per uint32: move N/2 uint elements
      and reinterpret with .format<>():
        a.row(i) = cm_load<uint32_t, N/2>(surf, byte_off).format<half>();   // load
        cm_store<uint32_t, N/2>(surf, byte_off, row.format<uint32_t>());     // store
      (Pack four 8-bit elements per uint32 the same way.) The gather/scatter
      forms (cm_load4 / per-lane offsets) have no such restriction but coalesce
      worse — prefer the packed block load.
    severity: critical

  - id: cm_autotune_register_file_size_values
    name: "-Qxcm_register_file_size only accepts platform-specific values"
    description: |
      The GRF register-file size (-Qxcm_register_file_size=<value>) must be one
      of the values the target platform supports; an unsupported value fails the
      build. Allowed values:
        - pre-XeHP (Gen12LP / Xe-LP, e.g. TGL, DG1): 128 only.
        - XeHP through Xe2 (Xe-HPG/Alchemist/DG2, Xe-HPC/PVC, Xe-LPG/Meteor &
          Arrow Lake, Xe2/Battlemage): 128, 256, or auto.
        - Xe3 and later: 32, 64, 96, 128, 160, 192, 256, or auto.
      When the exact architecture is unknown, 128 (default) and 256 ("large
      GRF") are valid on every XeHP-and-later part.
    severity: warning

  - id: cm_vector_matrix_views
    name: "CM vector/matrix manipulation reference: views, slices, references, reshapes"
    description: |
      Reference (NOT a prohibition) for how CM vector<>/matrix<> data is sliced,
      viewed, reshaped and combined. CM has NO pointers, arrays or C++ references —
      every in-thread data movement is expressed with these member functions on
      vector<T,N> / matrix<T,R,C> and their reference views. Getting the template
      parameter ORDER or the view-vs-copy semantics wrong silently corrupts results,
      so consult this before emitting any .select / .row / .column / .format /
      .replicate / .iselect / .merge call.

      BASE OBJECTS vs REFERENCE OBJECTS (views)
        - vector<T, N> / matrix<T, R, C> are BASE objects: they OWN GRF storage.
          N and R*C must be compile-time constants and the whole object must fit
          the per-thread GRF (see cm_register_file_budget).
        - vector_ref<T, N> / matrix_ref<T, R, C> are VIEWS: they own NO storage,
          they ALIAS a region of some base object. Every read/write through a view
          hits the base object's elements. Use a view to read or modify a sub-region
          IN PLACE; use a base object when you want an independent copy.
        - select / select_all / row / column / format all RETURN a *_ref view, so
          they are valid L-VALUES:  a.select<4,2>(0) = b;  writes into a.
        - iselect and replicate RETURN A NEW (copy) vector — they are NOT views and
          CANNOT appear on the left-hand side of an assignment.
        - A vector_ref / matrix_ref constructor only accepts a vector/matrix (or
          view) of the SAME type and size whose elements are CONTIGUOUS:
            matrix<float,8,4> m1;
            vector_ref<float,4> v1(m1.row(2));   // v1 aliases row 2 of m1

      ELEMENT ACCESS (returns a scalar l-value)
        v(i)      m(i, j)        // function-call style
        v[i]      m[i][j]        // array style (i = row, j = column)

      SELECT — strided sub-vector / sub-matrix (returns a VIEW)
        vector:  v.select<SIZE, STRIDE>(offset = 0)
            // SIZE elements, STRIDE apart, starting at offset
            b = a.select<4,2>(1);    // -> a(1), a(3), a(5), a(7)
            a.select<4,2>(0) = b;    // write b into a(0), a(2), a(4), a(6)
        matrix:  m.select<V_SIZE, V_STRIDE, H_SIZE, H_STRIDE>(i = 0, j = 0)
            // V_* selects rows, H_* selects columns; (i,j) = start row,col
            m2 = m1.select<2,2,2,4>(1,2);     // strided 2x2 sub-matrix
            m1.select<4,1,4,2>(0,0) = 0.0f;   // zero a strided region in place
        RESTRICTIONS: every stride must be > 0, and the stride MUST be 1 whenever
        the matching size is 1. Out-of-bound select is allowed as an optimization
        (out-of-bound elements are don't-cares and must not affect correctness).
        select_all(): a view of the WHOLE object (for a matrix it equals
        select<R,1,C,1>(0,0)); handy to pass a base object where a
        matrix_ref<T,R,C> parameter is expected.

      ROW / COLUMN (returns a VIEW)
        v = m.row(2);        // 2nd row as a vector_ref
        m.column(3) = 0;     // zero the 3rd column in place

      FORMAT — reinterpret element type and/or reshape (returns a VIEW)
        obj.format<T>()             // view as a flat vector<T, ...>
        obj.format<T, R, C>()       // view as a matrix<T, R, C>
        The object must be CONTIGUOUS and ALIGNED and the new byte size must not
        exceed the source. This is how 16/8-bit data rides 32-bit LSC block loads
        (see cm_block_load_requires_32bit):
            tile.row(r) = cm_load<uint32_t, N/2>(surf, off).format<half>();   // load
            cm_store<uint32_t, N/2>(surf, off, row.format<uint32_t>());       // store

      REPLICATE — broadcast a region into a NEW vector (copy; row-major order)
        x.replicate<REP>()                  // whole object, REP times
        x.replicate<REP, W>(i [,j])         // REP copies of W contiguous elements
        x.replicate<REP, VS, W>(i [,j])     // REP blocks of W, each block VS apart
        x.replicate<REP, VS, W, HS>(i [,j]) // ... plus intra-block element stride HS

      ISELECT — gather by index into a NEW vector (copy; NOT an l-value)
        vector<ushort, K> idx;               // index type MUST be ushort
        out = in.iselect(idx);               // out(k) = in(idx(k)); len(out)=len(idx)
        out = m.iselect(rowIdx, colIdx);     // out(k) = m(rowIdx(k), colIdx(k));
                                             // rowIdx and colIdx must be equal length

      MASKS, COMPARISON, MERGE, BOOLEAN REDUCTIONS
        - Comparisons are component-wise and produce a ushort MASK (0 / 1):
            vector<ushort,N> nz = (v != 0);    matrix<ushort,R,C> ge = (a >= b);
        - merge = masked move performed IN PLACE on the invoking object:
            dst.merge(src, mask);             // where mask set -> dst = src
            dst.merge(srcX, srcY, mask);      // mask set -> srcX else srcY
          mask may be an int (bit-packed) or a vector/matrix<ushort>. In MERGE only
          the LSB of each mask element is significant; in SIMD control flow ANY
          non-zero element is "true" — do not conflate the two rules.
        - Boolean reductions collapse a mask to a scalar usable in ordinary
          (scalar) if/while:  mask.any()  -> 1 if any element non-zero;
          mask.all() -> 1 if all non-zero.  e.g.  if ((a == 0).any()) { ... }

      WHOLE-OBJECT ARITHMETIC / ASSIGNMENT
        +, -, *, /, %, <<, >>, &, |, ^, ~ and their op= forms are all component-wise;
        a scalar operand is broadcast to every element. Mixed shapes are allowed iff
        the TOTAL element count matches — elements pair up in ROW-MAJOR order:
            m2 = m1 - v1;   // v1[0..C-1] -> m1.row(0), v1[C..2C-1] -> m1.row(1), ...
        All operands are read BEFORE the destination is written, so assignments
        through overlapping views are well defined (v2 = v1 + v2 with aliasing views
        uses the pre-update values).

      INITIALIZING SEQUENCES (compile-time friendly; prefer over per-element stores)
        const ushort a0_7[8] = {0,1,2,3,4,5,6,7};
        vector<ushort,8> v(a0_7);                 // C array initializer
        #include <cm/cmtl.h>
        cm_vector(v, ushort, 16, 2, 3);           // DECLARES + fills v = 2,5,8,...
        cm_matrix(m, ushort, 4, 8, 10, 5);        // DECLARES + fills m = 10,15,20,...
        cmtl::cm_vector_assign(v.select<10,1>(2), i, 3);  // fill an existing slice
        (cm_vector / cm_matrix DECLARE the variable themselves — do NOT declare it
        beforehand; cm_vector_assign needs an already-declared vector or view.)
    severity: info
