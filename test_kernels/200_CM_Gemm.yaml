# Spec for the naive CM GEMM seed kernel: D = A @ B
# A: [M, K] fp16, B: [K, N] fp16, D: [M, N] fp16.
inputs:
  A:
    shape: [M, K]
    dtype: float16
  B:
    shape: [K, N]
    dtype: float16

outputs:
  D:
    shape: [M, N]
    dtype: float16

grid:
  x: "ceil(M / (BLOCK_M * GROUP_M)) * GROUP_M"
  y: "ceil(N / (BLOCK_N * GROUP_N)) * GROUP_N"
  z: 1
  local:
    x: GROUP_M
    y: GROUP_N
    z: 1

ci:
  - params: [A, B]
    dims:
      M: 256
      N: 256
      K: 256
    flop: "2*M*N*K"

bench-gpu:
  - params: [A, B]
    dims:
      M: 4096
      N: 4096
      K: 4096
    flop: "2*M*N*K"
