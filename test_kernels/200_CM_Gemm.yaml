# Spec for the naive CM GEMM seed kernel: D = A @ B
# A: [M, K] fp16, B: [K, N] fp16, D: [M, N] fp32.
inputs:
  A:
    shape: [M, K]
    dtype: float16
  B:
    shape: [K, N]
    dtype: float16

outputs:
  D:
    shape: [M, N]
    dtype: float32

grid:
  x: "ceil(M / BLOCK_M)"
  y: "ceil(N / BLOCK_N)"
  z: 1

ci:
  - params: [A, B]
    dims:
      M: 256
      N: 256
      K: 256
    flop: "2*M*N*K"

bench-A:
  - params: [A, B]
    dims:
      M: 4096
      N: 4096
      K: 4096
    flop: "2*M*N*K"
