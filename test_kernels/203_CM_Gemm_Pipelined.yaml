# Spec for the register-blocked CM GEMM: D = A @ B
# A: [M, K] fp16, B: [K, N] fp16, D: [M, N] fp16 (fp16 fast-MAD accumulate).
# Same ABI/grid as 200_CM_Gemm; one BLOCK_M x BLOCK_N output tile per thread
# (GROUP_M = GROUP_N = 1, no cooperative SLM group). The 8x64x8 tile fits the
# DEFAULT register file, so no large-GRF build directive is needed (a measured
# sweep found small-tile + default GRF + single-buffer fastest on Xe-LPG; see
# the kernel header).
inputs:
  A:
    shape: [M, K]
    dtype: float16
  B:
    shape: [K, N]
    dtype: float16

outputs:
  D:
    shape: [M, N]
    dtype: float16

grid:
  x: "ceil(M / (BLOCK_M * GROUP_M)) * GROUP_M"
  y: "ceil(N / (BLOCK_N * GROUP_N)) * GROUP_N"
  z: 1
  local:
    x: GROUP_M
    y: GROUP_N
    z: 1

ci:
  - params: [A, B]
    dims:
      M: 256
      N: 256
      K: 256
    flop: "2*M*N*K"

bench-A:
  - params: [A, B]
    dims:
      M: 4096
      N: 4096
      K: 4096
    flop: "2*M*N*K"
