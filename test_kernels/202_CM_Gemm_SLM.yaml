# Spec for the cooperative SLM CM GEMM reference: D = A @ B
# A: [M, K] fp16, B: [K, N] fp16, D: [M, N] fp32.
#
# Same ABI and grid contract as the naive seed 200_CM_Gemm, but the kernel
# stages the shared B tile through SLM across a thread group (GROUP_M threads).
# Serves as the hand-written cooperative reference for the SLM optimization.
inputs:
  A:
    shape: [M, K]
    dtype: float16
  B:
    shape: [K, N]
    dtype: float16

outputs:
  D:
    shape: [M, N]
    dtype: float32

grid:
  x: "ceil(M / (BLOCK_M * GROUP_M)) * GROUP_M"
  y: "ceil(N / (BLOCK_N * GROUP_N)) * GROUP_N"
  z: 1
  local:
    x: GROUP_M
    y: GROUP_N
    z: 1

ci:
  - params: [A, B]
    dims:
      M: 256
      N: 256
      K: 256
    flop: "2*M*N*K"

bench-A:
  - params: [A, B]
    dims:
      M: 4096
      N: 4096
      K: 4096
    flop: "2*M*N*K"
